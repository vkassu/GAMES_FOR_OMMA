<!DOCTYPE html>
<!--
  Игра «Помоги зайке найти морковку» — развивающая цель: ПРОСТРАНСТВЕННОЕ МЫШЛЕНИЕ, планирование пути.
  Лабиринт генерируется на Canvas (рандомизированный алгоритм Прима + braiding).
  Зайка 🐰 ищет морковку 🥕. Управление: стрелки/WASD, свайпы по полю и
  экранный крестик (для телефона). За игру — 5 лабиринтов; звёзды зависят от
  того, насколько близко к кратчайшему пути (считается через поиск в ширину).
  Три уровня — размер лабиринта (7×7, 10×10, 14×14).
  Навигация как в других играх: верхний бар, выбор уровня, подтверждение
  выхода, переключатель игр.
  Чистый HTML/CSS/JS, один файл, офлайн, работает по file:// и на iOS.
-->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>

    --text: #1f2937;

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex; flex-direction: column; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .screen { width: 100%; max-width: 520px; text-align: center; }

  h1 { font-size: clamp(28px, 6.5vw, 44px); margin: 0 0 10px; }

    touch-action: manipulation; text-decoration: none;
  }
  .btn.secondary { background: #fff; color: var(--accent); box-shadow: 0 6px 16px rgba(79,70,229,0.16); }
  @media (hover: hover) { .btn:hover { filter: brightness(1.05); } }
  .btn:active { transform: scale(0.97); }

  .topbar { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .navbtn { font-family: inherit; font-weight: 700; font-size: clamp(14px, 3.4vw, 17px); border: none; background: #fff; color: var(--accent); border-radius: 999px; padding: 9px 16px; cursor: pointer; text-decoration: none; box-shadow: 0 4px 12px rgba(79,70,229,0.14); touch-action: manipulation; white-space: nowrap; }

  canvas#maze { width: min(320px, 82vw); height: auto; display: block; touch-action: none; }

  /* экранный крестик управления */
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; width: min(230px, 70vw); margin: 18px auto 0; }
  .dbtn {
    font-family: inherit; font-weight: 800; font-size: 28px;

  .dbtn:active { transform: scale(0.94); background: #eef2ff; }
  .up    { grid-column: 2; grid-row: 1; }

  .feedback { min-height: 34px; margin-top: 14px; font-size: clamp(19px, 4.2vw, 25px); font-weight: 700; }
  .feedback.good { color: var(--good); }

  .final-emoji { font-size: 72px; margin-bottom: 6px; }
  .stars { font-size: clamp(40px, 11vw, 64px); letter-spacing: 6px; margin: 8px 0 4px; animation: pop 0.5s ease; }
  @keyframes pop { 0%{transform:scale(1);} 45%{transform:scale(1.10);} 100%{transform:scale(1);} }
  .score-line { font-size: clamp(17px, 3.8vw, 22px); color: #4b5563; font-weight: 700; margin: 8px 0 26px; }

  .switcher { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }

  .game-pill { font-size: 30px; text-decoration: none; line-height: 1; background: #fff; border-radius: 16px; padding: 8px 12px; box-shadow: 0 6px 16px rgba(79,70,229,0.14); touch-action: manipulation; }
  .game-pill:active { transform: scale(0.94); }

  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .overlay.hidden { display: none; }
  .confirm-box { background: #fff; border-radius: 24px; padding: 26px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .confirm-box p { font-size: clamp(18px,4.4vw,22px); font-weight: 700; margin: 0 0 20px; }
  .confirm-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cbtn { font-family: inherit; font-weight: 700; font-size: clamp(16px,4vw,20px); border: none; border-radius: 14px; padding: 14px 26px; cursor: pointer; touch-action: manipulation; }
  .cbtn-yes { background: var(--accent); color: #fff; }
  .cbtn-no  { background: #eee; color: #1f2937; }

  <!-- Экран старта: выбор уровня -->

<script>
"use strict";

const SIZES = { 1: 7, 2: 10, 3: 14 };
const LEVEL_NAMES = { 1: 'Маленький', 2: 'Средний', 3: 'Большой' };
const MAZES_PER_GAME = 5;
// Доля тупиков, которые «расшиваем» в петли (braiding): больше число = больше
// альтернативных маршрутов и развилок (и чуть легче). Маленький уровень —
// побольше выбора; большой и так ветвистый, петель меньше.
const BRAID = { 1: 0.30, 2: 0.22, 3: 0.15 };

// Направления (битовая маска открытых сторон клетки).
const N = 1, E = 2, S = 4, W = 8;
const DR = { 1:-1, 2:0, 4:1, 8:0 };
const DC = { 1:0, 2:1, 4:0, 8:-1 };
const OPP = { 1:4, 2:8, 4:1, 8:2 };

const startScreen = document.getElementById('startScreen');
const gameScreen  = document.getElementById('gameScreen');
const endScreen   = document.getElementById('endScreen');
const progressEl  = document.getElementById('progress');
const feedbackEl  = document.getElementById('feedback');
const scoreLineEl = document.getElementById('scoreLine');
const starsEl     = document.getElementById('stars');
const endTitleEl  = document.getElementById('endTitle');
const endSummaryEl= document.getElementById('endSummary');
const navRight    = document.getElementById('navRight');
const canvas      = document.getElementById('maze');

let currentLevel = 1;
let cols = 7, rows = 7;
let grid = [];          // open-маска по клеткам
let pr = 0, pc = 0;     // позиция зайки-игрока (row, col)
let gr = 0, gc = 0;     // позиция морковки-цели (конец самого длинного маршрута от старта)
let moves = 0;
let optimal = 0;
let mazeIndex = 0;      // какой лабиринт по счёту (0-based)
let totalMoves = 0;
let totalOptimal = 0;
let solvedLock = false; // пауза между лабиринтами
let coins = new Set();      // клетки со звёздочками
let coinsGot = 0;
const coinsPerMaze = 3;
let totalCoinsGot = 0, totalCoinsAll = 0;
let visited = [];           // пройденные клетки (для следа)

function updateProgress() {
  progressEl.textContent = LEVEL_NAMES[currentLevel] + ' · Лабиринт ' + (mazeIndex + 1) +
    ' из ' + MAZES_PER_GAME + ' · ⭐ ' + coinsGot + '/' + (coinsGot + coins.size);
}

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function idx(r, c) { return r * cols + c; }

/* ---------- Генерация лабиринта (рандомизированный Прим + braiding) ----------
   Прим даёт «ветвистый» лабиринт с частыми развилками — на пути к морковке много
   точек выбора (в отличие от DFS, который рисует один длинный коридор и прячет
   половину карты в хвосте у финиша). Затем braiding расшивает часть тупиков,
   пробивая лишние проходы: появляются петли и НЕСКОЛЬКО маршрутов к морковке. */
function genMaze() {
  grid = new Array(cols * rows).fill(0);
  const inMaze = new Array(cols * rows).fill(false);
  const frontier = [];                       // клетки, граничащие с готовым лабиринтом
  function addFrontier(r, c) {
    [N, E, S, W].forEach(function (d) {
      const nr = r + DR[d], nc = c + DC[d];
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !inMaze[idx(nr, nc)]
          && !frontier.some(function (f) { return f[0] === nr && f[1] === nc; })) {
        frontier.push([nr, nc]);
      }
    });
  }
  inMaze[idx(0, 0)] = true;
  addFrontier(0, 0);
  while (frontier.length) {
    const pick = randInt(0, frontier.length - 1);
    const fc = frontier.splice(pick, 1)[0];
    const r = fc[0], c = fc[1];
    if (inMaze[idx(r, c)]) continue;
    // подключаем клетку к случайному уже-готовому соседу
    const dirs = [N, E, S, W].filter(function (d) {
      const nr = r + DR[d], nc = c + DC[d];
      return nr >= 0 && nr < rows && nc >= 0 && nc < cols && inMaze[idx(nr, nc)];
    });
    const d = dirs[randInt(0, dirs.length - 1)];
    const nr = r + DR[d], nc = c + DC[d];
    grid[idx(r, c)] |= d;
    grid[idx(nr, nc)] |= OPP[d];
    inMaze[idx(r, c)] = true;
    addFrontier(r, c);
  }
  braidMaze(BRAID[currentLevel] || 0.2);
}

// Расшиваем тупики: у клетки с одним выходом с вероятностью p пробиваем ещё
// один проход к соседней клетке — получается петля (альтернативный путь).
function braidMaze(p) {
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = idx(r, c);
      let cnt = 0;
      [N, E, S, W].forEach(function (d) { if (grid[cell] & d) cnt++; });
      if (cnt === 1 && Math.random() < p) {
        const cand = [N, E, S, W].filter(function (d) {
          if (grid[cell] & d) return false;                 // не туда, где уже открыто
          const nr = r + DR[d], nc = c + DC[d];
          return nr >= 0 && nr < rows && nc >= 0 && nc < cols;
        });
        if (cand.length) {
          const d = cand[randInt(0, cand.length - 1)];
          const nr = r + DR[d], nc = c + DC[d];
          grid[cell] |= d;
          grid[idx(nr, nc)] |= OPP[d];
        }
      }
    }
  }
}

// Расстояния (в шагах) от клетки start до всех остальных — поиск в ширину.
function bfsFrom(start) {
  const dist = new Array(cols * rows).fill(-1);
  dist[start] = 0;
  const queue = [[Math.floor(start / cols), start % cols]];
  let head = 0;
  while (head < queue.length) {
    const [r, c] = queue[head++];
    const open = grid[idx(r, c)];
    [N, E, S, W].forEach((d) => {
      if (open & d) {
        const nr = r + DR[d], nc = c + DC[d];
        if (dist[idx(nr, nc)] === -1) {
          dist[idx(nr, nc)] = dist[idx(r, c)] + 1;
          queue.push([nr, nc]);
        }
      }
    });
  }
  return dist;
}

/* ---------- Рисование ---------- */
const ctx = canvas.getContext('2d');
const SIZE = 330;
(function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = SIZE * dpr;
  canvas.height = SIZE * dpr;
  ctx.scale(dpr, dpr);
})();

function drawMaze() {
  const s = SIZE / cols;
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, SIZE, SIZE);

  ctx.strokeStyle = '#4338ca';
  ctx.lineWidth = Math.max(2, s * 0.12);
  ctx.lineCap = 'round';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const open = grid[idx(r, c)];
      const x = c * s, y = r * s;
      ctx.beginPath();
      if (!(open & N)) { ctx.moveTo(x, y);       ctx.lineTo(x + s, y); }
      if (!(open & S)) { ctx.moveTo(x, y + s);   ctx.lineTo(x + s, y + s); }
      if (!(open & W)) { ctx.moveTo(x, y);       ctx.lineTo(x, y + s); }
      if (!(open & E)) { ctx.moveTo(x + s, y);   ctx.lineTo(x + s, y + s); }
      ctx.stroke();
    }
  }

  // след пройденного пути
  ctx.fillStyle = 'rgba(79,70,229,0.18)';
  for (var tr = 0; tr < rows; tr++) for (var tc = 0; tc < cols; tc++) {
    if (visited[idx(tr, tc)] && !(tr === pr && tc === pc)) {
      ctx.beginPath();
      ctx.arc((tc + 0.5) * s, (tr + 0.5) * s, Math.max(2, s * 0.10), 0, 2 * Math.PI);
      ctx.fill();
    }
  }
  // звёздочки-собиралки
  ctx.fillStyle = '#000';   // сброс альфы следа — иначе эмодзи рисуются бледными
  ctx.font = (s * 0.55) + 'px "Segoe UI Emoji", "Apple Color Emoji", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  coins.forEach(function (ci) { ctx.fillText('⭐', ((ci % cols) + 0.5) * s, (Math.floor(ci / cols) + 0.5) * s); });

  ctx.font = (s * 0.7) + 'px "Segoe UI Emoji", "Apple Color Emoji", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🥕', (gc + 0.5) * s, (gr + 0.5) * s);       // морковка на конце самого длинного маршрута
  ctx.fillText('🐰', (pc + 0.5) * s, (pr + 0.5) * s);       // зайка-игрок
}

/* ---------- Логика ---------- */
function newMaze() {
  genMaze();
  // Зайка и морковка — на двух концах самого длинного маршрута (диаметр лабиринта).
  // Двойной BFS: из любой клетки → самая дальняя A; из A → самая дальняя B.
  const dA = bfsFrom(0);
  var startCell = 0;
  for (var ia = 1; ia < dA.length; ia++) { if (dA[ia] > dA[startCell]) startCell = ia; }
  const dB = bfsFrom(startCell);
  var goalCell = startCell;
  for (var ib = 0; ib < dB.length; ib++) { if (dB[ib] > dB[goalCell]) goalCell = ib; }
  pr = Math.floor(startCell / cols); pc = startCell % cols;   // старт мыши
  gr = Math.floor(goalCell / cols);  gc = goalCell % cols;    // морковка
  optimal = dB[goalCell];
  moves = 0;
  solvedLock = false;
  // расставляем звёздочки-собиралки (не на старте-зайке и не на морковке)
  coins = new Set();
  var guard = 0;
  while (coins.size < coinsPerMaze && guard++ < 500) {
    var ci = randInt(0, cols * rows - 1);
    if (ci !== startCell && ci !== goalCell) coins.add(ci);
  }
  coinsGot = 0; totalCoinsAll += coins.size;
  visited = new Array(cols * rows).fill(false);
  visited[startCell] = true;
  updateProgress();
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  drawMaze();
}

function tryMove(d) {
  if (solvedLock) return;
  ensureAudio();
  const open = grid[idx(pr, pc)];
  if (open & d) {
    pr += DR[d]; pc += DC[d];
    moves++;
    var cell = idx(pr, pc);
    visited[cell] = true;
    if (coins.has(cell)) { coins.delete(cell); coinsGot++; totalCoinsGot++; playCoin(); updateProgress(); }
    drawMaze();
    if (pr === gr && pc === gc) onSolve();
  }
}

function onSolve() {
  solvedLock = true;
  totalMoves += moves;
  totalOptimal += optimal;
  playGood();
  feedbackEl.textContent = 'Морковка найдена! 🎉';
  feedbackEl.className = 'feedback good';
  setTimeout(() => {
    mazeIndex++;
    if (mazeIndex < MAZES_PER_GAME) newMaze();
    else showEnd();
  }, 900);
}

function startGame(level) {
  currentLevel = level;
  cols = rows = SIZES[level];
  mazeIndex = 0;
  totalMoves = 0;
  totalOptimal = 0;
  totalCoinsGot = 0;
  totalCoinsAll = 0;
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  navRight.classList.remove('hidden');
  newMaze();
}

function showStart() {
  gameScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
  navRight.classList.add('hidden');
}

function showEnd() {
  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  navRight.classList.add('hidden');

  // звёзды — за то, насколько близко к кратчайшему пути (без «проигрыша»)
  const ratio = totalOptimal > 0 ? totalMoves / totalOptimal : 1;
  let stars, title, summary;
  if (ratio <= 1.3) {
    stars = '⭐⭐⭐'; title = 'Превосходно!';
    summary = 'Ты шёл почти кратчайшим путём — отличное чутьё!';
  } else if (ratio <= 1.9) {
    stars = '⭐⭐'; title = 'Здорово!';
    summary = 'Хорошо прошёл! В следующий раз попробуй найти путь покороче.';
  } else {
    stars = '⭐'; title = 'Молодец!';
    summary = 'Все морковки найдены! Чем больше играешь — тем быстрее находишь путь!';
  }
  var nm = ''; try { nm = localStorage.getItem('omma_name') || ''; } catch (e) {}
  endTitleEl.textContent = nm ? title.replace(/!$/, ', ' + nm + '!') : title;
  starsEl.textContent = stars;
  endSummaryEl.textContent = summary;
  scoreLineEl.textContent = 'Уровень «' + LEVEL_NAMES[currentLevel] + '». Шагов: ' + totalMoves +
    ' · собрано ⭐ ' + totalCoinsGot + '/' + totalCoinsAll;
  playGood();
  if (window.fireConfetti) fireConfetti();
  if (window.awardStars) awardStars('labirint', stars.length);
}

/* ---------- Управление ---------- */
// Экранный крестик.
document.querySelector('.dpad').addEventListener('click', (e) => {
  const b = e.target.closest('.dbtn');
  if (b) tryMove(parseInt(b.getAttribute('data-dir'), 10));
});

// Клавиатура: стрелки и WASD.
document.addEventListener('keydown', (e) => {
  if (gameScreen.classList.contains('hidden')) return;
  let d = 0;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'ц' || e.key === 'W') d = N;
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'ы' || e.key === 'S') d = S;
  else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ф' || e.key === 'A') d = W;
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в' || e.key === 'D') d = E;
  if (d) { e.preventDefault(); tryMove(d); }
});

// Свайпы по полю.
let sx = 0, sy = 0, swiping = false;
canvas.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  sx = t.clientX; sy = t.clientY; swiping = true;
}, { passive: true });
canvas.addEventListener('touchmove', (e) => { if (swiping) e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', (e) => {
  if (!swiping) return;
  swiping = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;     // слишком короткий жест
  if (Math.abs(dx) > Math.abs(dy)) tryMove(dx > 0 ? E : W);
  else tryMove(dy > 0 ? S : N);
}, { passive: true });

/* ---------- Звук ---------- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freqs, dur, type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  freqs.forEach((f, i) => {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    const t0 = now + i * 0.12;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  });
}
const playGood = () => tone([523.25, 659.25, 783.99], 0.22);
const playCoin = () => tone([880, 1175], 0.10);

/* ---------- Навигация и подтверждение выхода ---------- */
const confirmOverlay = document.getElementById('confirmOverlay');
const confirmTextEl  = document.getElementById('confirmText');
let pendingYes = null;
function askConfirm(msg, onYes) { confirmTextEl.textContent = msg; pendingYes = onYes; confirmOverlay.classList.remove('hidden'); }
document.getElementById('cfYes').addEventListener('click', () => { confirmOverlay.classList.add('hidden'); const fn = pendingYes; pendingYes = null; if (fn) fn(); });
document.getElementById('cfNo').addEventListener('click', () => { confirmOverlay.classList.add('hidden'); pendingYes = null; });

function midGame() { return !gameScreen.classList.contains('hidden') && (mazeIndex > 0 || moves > 0); }

document.querySelectorAll('.level-btn').forEach((b) => {
  b.addEventListener('click', () => { ensureAudio(); startGame(parseInt(b.getAttribute('data-level'), 10)); });
});
document.getElementById('homeBtn').addEventListener('click', (e) => {
  if (midGame()) { e.preventDefault(); askConfirm('Выйти в меню? Эта игра не сохранится.', () => { window.location.href = 'index.html'; }); }
});
document.getElementById('levelBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Сменить уровень? Эта игра не сохранится.', showStart); else showStart();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Начать заново? Эта игра не сохранится.', () => startGame(currentLevel)); else startGame(currentLevel);
});
document.getElementById('againBtn').addEventListener('click', () => startGame(currentLevel));
document.getElementById('changeLevelBtn').addEventListener('click', showStart);
</script>

  <canvas id="confetti" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;"></canvas>
  <script>
  (function(){
    var cv=document.getElementById('confetti'), cx=cv.getContext('2d'), parts=[], raf=null;
    function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
    window.addEventListener('resize',resize); resize();
    var EMO=['⭐','🌟','💖','💛','✨','🎉','🌸'];
    window.fireConfetti=function(){
      resize();
      for(var i=0;i<40;i++){
        parts.push({x:cv.width*(0.2+Math.random()*0.6), y:cv.height*0.3+(Math.random()-0.5)*60,
          vx:(Math.random()-0.5)*9, vy:-7-Math.random()*7, g:0.28+Math.random()*0.15,
          s:18+Math.random()*16, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3,
          e:EMO[Math.floor(Math.random()*EMO.length)], life:0});
      }
      if(!raf) raf=requestAnimationFrame(step);
    };
    function step(){
      cx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<parts.length;i++){ var p=parts[i];
        p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
        cx.font=p.s+'px "Segoe UI Emoji","Apple Color Emoji",system-ui,sans-serif';
        cx.textAlign='center'; cx.textBaseline='middle';
        cx.globalAlpha=Math.max(0,1-p.life/130);
        cx.fillText(p.e,0,0); cx.restore();
      }
      parts=parts.filter(function(p){return p.life<130 && p.y<cv.height+50;});
      if(parts.length) raf=requestAnimationFrame(step); else { cx.clearRect(0,0,cv.width,cv.height); raf=null; }
    }
  })();
  window.awardStars=function(game,n){try{
    localStorage.setItem('omma_stars_total',(parseInt(localStorage.getItem('omma_stars_total')||'0',10)||0)+n);
    var bk='omma_best_'+game, b=parseInt(localStorage.getItem(bk)||'0',10)||0; if(n>b) localStorage.setItem(bk,n);
    localStorage.setItem('omma_plays_total',(parseInt(localStorage.getItem('omma_plays_total')||'0',10)||0)+1);
  }catch(e){}};
  </script>
