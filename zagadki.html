<!DOCTYPE html>
<!--
  Игра «Загадки» — развивающая цель: СМЕКАЛКА, ОБРАЗНОЕ МЫШЛЕНИЕ, РЕЧЬ.
  Ребёнок читает русскую народную (детскую) загадку и выбирает отгадку
  из ШЕСТИ картинок. Загадки русские — с рифмой и образами, не переводные.
  Банк 100+ загадок (есть и посложнее: земля, роса, туман, мороз,
  глаза). В каждой игре — 12 случайных. Варианты-обманки из той же темы,
  чтобы надо было думать, а не угадывать по картинке.
  Мягкая обратная связь: за верный ответ — похвала, на ошибку — «подумай
  ещё» без проигрыша. В конце — звёздочки.
  Чистый HTML/CSS/JS, один файл, офлайн, работает по file:// и на iOS.
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Загадки">
<meta name="mobile-web-app-capable" content="yes">
<title>Загадки</title>
<style>
  :root {
    --bg1: #cffafe;
    --bg2: #fae8ff;
    --card: #ffffff;
    --text: #1f2937;
    --accent: #0e7490;
    --accent2: #7c3aed;
    --good: #22c55e;
    --good-bg: #dcfce7;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;  /* убираем серую вспышку iOS */
  }
  html { -webkit-text-size-adjust: 100%; }     /* iOS не раздувает шрифт */
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    /* без выделения текста и меню при удержании пальца */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .screen { width: 100%; max-width: 660px; text-align: center; }
  .hidden { display: none; }

  h1 { font-size: clamp(30px, 7vw, 48px); margin: 0 0 10px; }
  .lead { color: #4b5563; font-size: clamp(16px, 3.6vw, 21px); margin: 0 0 28px; }

  .btn {
    display: inline-block;
    border: none;
    border-radius: 18px;
    padding: 16px 34px;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: var(--accent2);
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.30);
    touch-action: manipulation;          /* мгновенный тап без зума */
    text-decoration: none;
  }
  .btn.secondary {
    background: #fff;
    color: var(--accent2);
    box-shadow: 0 6px 16px rgba(124, 58, 237, 0.16);
  }
  @media (hover: hover) {
    .btn:hover { filter: brightness(1.05); }
  }
  .btn:active { transform: scale(0.97); }

  /* ---- игровой экран ---- */
  .progress {
    font-size: clamp(15px, 3.4vw, 19px);
    color: #6b7280;
    font-weight: 700;
    margin-bottom: 12px;
  }
  /* Карточка-загадка */
  .riddle {
    background: var(--card);
    border-radius: 24px;
    padding: 20px 18px;
    margin: 0 auto 18px;
    box-shadow: 0 10px 26px rgba(14, 116, 144, 0.16);
    font-size: clamp(18px, 4.2vw, 25px);
    font-weight: 600;
    line-height: 1.42;
  }
  .riddle .ico { font-size: 36px; display: block; margin-bottom: 4px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .opt {
    background: var(--card);
    border: 4px solid transparent;
    border-radius: 20px;
    padding: 14px 8px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(14, 116, 144, 0.12);
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    touch-action: manipulation;
    word-break: break-word;
  }
  .opt .face { font-size: clamp(38px, 9.5vw, 54px); line-height: 1; }
  .opt .word { font-size: clamp(15px, 3.6vw, 19px); }
  @media (hover: hover) {
    .opt:hover { transform: translateY(-3px); border-color: var(--accent); }
  }
  .opt:active { transform: scale(0.97); }
  .opt.correct {
    background: var(--good-bg);
    border-color: var(--good);
    animation: pop 0.4s ease;
  }
  .opt.wrong { animation: shake 0.45s ease; }
  .opt.locked { pointer-events: none; }
  .opt.dim { opacity: 0.4; }

  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.10); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .feedback {
    min-height: 38px;
    margin-top: 18px;
    font-size: clamp(19px, 4.2vw, 25px);
    font-weight: 700;
  }
  .feedback.good { color: var(--good); }
  .feedback.retry { color: #d97706; }
  .next-wrap { min-height: 70px; margin-top: 12px; }

  .final-emoji { font-size: 72px; margin-bottom: 6px; }
  .stars {
    font-size: clamp(40px, 11vw, 64px);
    letter-spacing: 6px;
    margin: 8px 0 4px;
    animation: pop 0.5s ease;
  }
  .score-line {
    font-size: clamp(17px, 3.8vw, 22px);
    color: #4b5563;
    font-weight: 700;
    margin: 8px 0 26px;
  }
  .final-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  /* верхний бар навигации */
  .topbar {
    width: 100%; max-width: 660px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 16px;
  }
  .navbtn {
    font-family: inherit; font-weight: 700; font-size: clamp(14px, 3.4vw, 17px);
    border: none; background: #fff; color: var(--accent2);
    border-radius: 999px; padding: 9px 16px; cursor: pointer;
    text-decoration: none; box-shadow: 0 4px 12px rgba(124,58,237,0.14);
    touch-action: manipulation; white-space: nowrap;
  }
  .navbtn:active { transform: scale(0.96); }
  .navright { display: flex; gap: 8px; }
  .navright.hidden { display: none; }   /* перебиваем общий .hidden по специфичности */
  /* переключатель игр на финальном экране */
  .switcher {
    margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: center;
  }
  .switcher-label { font-size: clamp(15px,3.4vw,18px); font-weight: 700; color: #6b7280; }
  .game-pill {
    font-size: 30px; text-decoration: none; line-height: 1;
    background: #fff; border-radius: 16px; padding: 8px 12px;
    box-shadow: 0 6px 16px rgba(124,58,237,0.14); touch-action: manipulation;
  }
  .game-pill:active { transform: scale(0.94); }
  /* подтверждение выхода */
  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .overlay.hidden { display: none; }
  .confirm-box {
    background: #fff; border-radius: 24px; padding: 26px 24px;
    max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .confirm-box p { font-size: clamp(18px,4.4vw,22px); font-weight: 700; margin: 0 0 20px; }
  .confirm-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cbtn {
    font-family: inherit; font-weight: 700; font-size: clamp(16px,4vw,20px);
    border: none; border-radius: 14px; padding: 14px 26px; cursor: pointer; touch-action: manipulation;
  }
  .cbtn-yes { background: var(--accent2); color: #fff; }
  .cbtn-no  { background: #eee; color: #1f2937; }
</style>
</head>
<body>

  <header class="topbar">
    <a class="navbtn" id="homeBtn" href="index.html">🏠 К играм</a>
    <div class="navright hidden" id="navRight">
      <button class="navbtn" id="restartBtn">🔄 Заново</button>
    </div>
  </header>

  <!-- Экран старта -->
  <div id="startScreen" class="screen">
    <div class="final-emoji">🤔</div>
    <h1>Загадки</h1>
    <p class="lead">Слушай загадку — и выбирай отгадку!<br>Вариантов теперь шесть, думай хорошенько 🙂</p>
    <button class="btn" id="startBtn">Начать 🚀</button>
  </div>

  <!-- Игровой экран -->
  <div id="gameScreen" class="screen hidden">
    <div class="progress" id="progress">Загадка 1 из 12</div>
    <div class="riddle" id="riddle"><span class="ico">🤔</span><span id="riddleText"></span></div>
    <div class="grid" id="grid"></div>
    <div class="feedback" id="feedback"></div>
    <div class="next-wrap" id="nextWrap"></div>
  </div>

  <!-- Финальный экран -->
  <div id="endScreen" class="screen hidden">
    <div class="final-emoji">🌟</div>
    <h1 id="endTitle">Молодец!</h1>
    <div class="stars" id="stars"></div>
    <p class="lead" id="endSummary">Ты отгадала все загадки!</p>
    <p class="score-line" id="scoreLine"></p>
    <div class="final-buttons">
      <button class="btn" id="againBtn">Ещё загадки 🔁</button>
    </div>
    <div class="switcher">
      <span class="switcher-label">Другая игра:</span>
      <a class="game-pill" href="matematika.html" title="Математика">🧮</a>
      <a class="game-pill" href="pamyat.html" title="Память">🧠</a>
      <a class="game-pill" href="naydi-lishnee.html" title="Найди лишнее">🔍</a>
      <a class="game-pill" href="chasy.html" title="Который час?">🕐</a>
      <a class="game-pill" href="magazin.html" title="Магазин и сдача">🛒</a>
      <a class="game-pill" href="labirint.html" title="Помоги зайке найти морковку">🌀</a>
      <a class="game-pill" href="tatar.html" title="Татарские слова">🗣️</a>
      <a class="game-pill" href="english.html" title="Английские слова">🔤</a>
      <a class="game-pill" href="kirpichi.html" title="Увернись от кирпичей">🧱</a>
    </div>
  </div>

  <div class="overlay hidden" id="confirmOverlay">
    <div class="confirm-box">
      <p id="confirmText">Выйти? Прогресс не сохранится.</p>
      <div class="confirm-actions">
        <button class="cbtn cbtn-yes" id="cfYes">Да</button>
        <button class="cbtn cbtn-no" id="cfNo">Остаться</button>
      </div>
    </div>
  </div>

<script>
"use strict";

/* ---------- Банк из 100+ загадок ----------
   Настоящие русские народные и детские загадки.
   Поля:
     q    — текст загадки;
     opts — ШЕСТЬ вариантов-отгадок [эмодзи, слово];
     a    — индекс правильной отгадки (до перемешивания вариантов).
   В каждой игре берётся GAME_SIZE случайных загадок; варианты
   перемешиваются, поэтому правильный оказывается в случайном месте.
*/
const RIDDLES = [
  /* ===== Звери ===== */
  { q:'Хитрая плутовка, рыжая головка, хвост пушистый — краса! Кто же это?', a:0,
    opts:[['🦊','Лиса'],['🐺','Волк'],['🐰','Заяц'],['🐱','Кошка'],['🐿️','Белка'],['🐶','Собака']] },
  { q:'Косолапый и большой, спит в берлоге он зимой. Любит шишки, любит мёд. Ну-ка, кто же назовёт?', a:0,
    opts:[['🐻','Медведь'],['🦊','Лиса'],['🐗','Кабан'],['🦌','Олень'],['🐺','Волк'],['🦡','Барсук']] },
  { q:'Кто зимой холодной бродит злой, голодный?', a:0,
    opts:[['🐺','Волк'],['🐻','Медведь'],['🦊','Лиса'],['🐶','Собака'],['🐰','Заяц'],['🐗','Кабан']] },
  { q:'Длинное ухо, комочек пуха, прыгает ловко, грызёт морковку.', a:0,
    opts:[['🐰','Заяц'],['🐭','Мышка'],['🐹','Хомяк'],['🐱','Котёнок'],['🐿️','Белка'],['🦔','Ёжик']] },
  { q:'Кто по ёлкам ловко скачет и взлетает на дубы? Кто в дупле орешки прячет, сушит на зиму грибы?', a:0,
    opts:[['🐿️','Белка'],['🐭','Мышь'],['🦊','Лиса'],['🐦','Птица'],['🐰','Заяц'],['🦔','Ёж']] },
  { q:'Мордочка усатая, шубка полосатая, часто умывается, а с водою не знается.', a:0,
    opts:[['🐱','Кошка'],['🐶','Собака'],['🐯','Тигр'],['🐭','Мышь'],['🦊','Лиса'],['🐰','Заяц']] },
  { q:'Спереди пятачок, сзади крючок, а на спинке щетинка.', a:0,
    opts:[['🐷','Свинья'],['🐮','Корова'],['🐑','Овца'],['🐴','Лошадь'],['🐐','Коза'],['🐗','Кабан']] },
  { q:'Сытая — жуёт, голодная — мычит, всем ребятам молоко даёт.', a:0,
    opts:[['🐮','Корова'],['🐐','Коза'],['🐑','Овца'],['🐷','Свинья'],['🐴','Лошадь'],['🐱','Кошка']] },
  { q:'Под соснами, под ёлками лежит мешок с иголками.', a:0,
    opts:[['🦔','Ёж'],['🐭','Мышь'],['🐢','Черепаха'],['🐹','Хомяк'],['🐿️','Белка'],['🐰','Заяц']] },
  { q:'Не земледелец, не кузнец, не плотник, а первый на селе работник.', a:0,
    opts:[['🐴','Конь'],['🐮','Корова'],['🐂','Бык'],['🐐','Коза'],['🐑','Овца'],['🐷','Свинья']] },
  { q:'С бородой, а не старик, с рогами, а не бык, доят, а не корова, лыко дерёт, а лаптей не плетёт.', a:0,
    opts:[['🐐','Коза'],['🐑','Овца'],['🐮','Корова'],['🐏','Баран'],['🐴','Лошадь'],['🦌','Олень']] },
  { q:'По горам, по долам ходит шуба да кафтан.', a:0,
    opts:[['🐑','Овца'],['🐐','Коза'],['🐮','Корова'],['🐷','Свинья'],['🐴','Лошадь'],['🐶','Собака']] },
  { q:'С хозяином дружит, дом сторожит, живёт под крылечком, а хвостик колечком.', a:0,
    opts:[['🐶','Собака'],['🐱','Кошка'],['🐺','Волк'],['🦊','Лиса'],['🐓','Петух'],['🐐','Коза']] },
  { q:'Маленький рост, длинный хвост, серая шубка, острые зубки.', a:0,
    opts:[['🐭','Мышь'],['🐀','Крыса'],['🐹','Хомяк'],['🐰','Заяц'],['🐿️','Белка'],['🐱','Кошка']] },
  { q:'Великан в зоопарке: носит длинный хобот, ушами машет, как лопатами, и всех сильней на свете.', a:0,
    opts:[['🐘','Слон'],['🦛','Бегемот'],['🦏','Носорог'],['🦒','Жираф'],['🐫','Верблюд'],['🐂','Бык']] },
  { q:'Узнать его нам просто, узнать его легко: высокого он роста и видит далеко.', a:0,
    opts:[['🦒','Жираф'],['🐘','Слон'],['🦓','Зебра'],['🐫','Верблюд'],['🦌','Олень'],['🐴','Лошадь']] },
  { q:'Зверь я горбатый, а нравлюсь ребятам, по пустыне хожу, груз тяжёлый вожу.', a:0,
    opts:[['🐫','Верблюд'],['🐘','Слон'],['🐂','Бык'],['🦛','Бегемот'],['🦏','Носорог'],['🐴','Лошадь']] },
  { q:'Царь зверей силён и смел, рыжей гривою одет. Грозно он рычит на всех, страшен этот людям рёв.', a:0,
    opts:[['🦁','Лев'],['🐯','Тигр'],['🐻','Медведь'],['🐺','Волк'],['🐆','Леопард'],['🐱','Кот']] },
  { q:'По деревьям прыг да скок, любит спелый он цветок. Хвостик длинный, всем хорош. На кого же он похож?', a:0,
    opts:[['🐵','Обезьяна'],['🐿️','Белка'],['🐱','Кот'],['🦜','Попугай'],['🐯','Тигр'],['🦊','Лиса']] },
  { q:'Что за зверь со мной играет: не мычит, не ржёт, не лает, нападает на клубки, прячет в лапки коготки?', a:0,
    opts:[['🐱','Котёнок'],['🐶','Щенок'],['🐰','Зайчонок'],['🐭','Мышонок'],['🦊','Лисёнок'],['🐿️','Бельчонок']] },

  /* ===== Птицы ===== */
  { q:'Хвост с узорами, сапоги со шпорами, песни распевает, время считает.', a:0,
    opts:[['🐓','Петух'],['🐔','Курица'],['🦆','Утка'],['🦃','Индюк'],['🦢','Гусь'],['🦚','Павлин']] },
  { q:'Всю ночь летает — мышей добывает. А станет светло — спать летит в дупло.', a:0,
    opts:[['🦉','Сова'],['🦅','Орёл'],['🐦','Воробей'],['🕊️','Голубь'],['🦜','Попугай'],['🦆','Утка']] },
  { q:'Явился в жёлтой шубке: прощайте, две скорлупки!', a:0,
    opts:[['🐤','Цыплёнок'],['🦆','Утёнок'],['🐦','Воробей'],['🕊️','Голубь'],['🐥','Птенец'],['🦢','Гусёнок']] },
  { q:'Кто без нот и без свирели лучше всех выводит трели, голосистее, нежней?', a:0,
    opts:[['🐦','Соловей'],['🦉','Сова'],['🐓','Петух'],['🦆','Утка'],['🦜','Попугай'],['🦅','Орёл']] },
  { q:'Белый, как снег, надутый, как мех, лопаточками ходит, а рогом ест.', a:0,
    opts:[['🦢','Гусь'],['🦆','Утка'],['🦅','Орёл'],['🐔','Курица'],['🐓','Петух'],['🦃','Индюк']] },
  { q:'Распускает хвост, как веер, ходит важным господином, по земле ногами — стук. Как зовут его, мой друг?', a:0,
    opts:[['🦃','Индюк'],['🐓','Петух'],['🦚','Павлин'],['🦢','Гусь'],['🕊️','Голубь'],['🦆','Утка']] },
  { q:'Кто в лесу деревья лечит? Целый день стучит по веткам и жуков-вредин клюёт.', a:0,
    opts:[['🐦','Дятел'],['🦉','Сова'],['🦅','Орёл'],['🦜','Попугай'],['🕊️','Голубь'],['🦆','Утка']] },
  { q:'Маленькая птичка скачет по дорожке, ищет в снеге крошки. Чик-чирик!', a:0,
    opts:[['🐦','Воробей'],['🕊️','Голубь'],['🦉','Сова'],['🦅','Орёл'],['🦜','Попугай'],['🦆','Утка']] },

  /* ===== Насекомые ===== */
  { q:'Над цветком порхает, пляшет, веерком узорным машет.', a:0,

    opts:[['🚀','Ракета'],['✈️','Самолёт'],['🚁','Вертолёт'],['🚂','Поезд'],['🚗','Машина'],['🚢','Корабль']] },

/* ---------- Звук: один переиспользуемый AudioContext (правило iOS) ---------- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freqs, dur, type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  freqs.forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = f;
    const t0 = now + i * 0.12;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  });
}
const playGood  = () => tone([523.25, 659.25, 783.99], 0.22);          // до-ми-соль вверх
const playRetry = () => tone([330, 247], 0.16, 'triangle');            // мягко вниз, не резко

/* ---------- Логика игры ---------- */
const GAME_SIZE = 12;          // сколько загадок показываем за одну игру

const startScreen = document.getElementById('startScreen');
const gameScreen  = document.getElementById('gameScreen');
const endScreen   = document.getElementById('endScreen');
const gridEl      = document.getElementById('grid');
const progressEl  = document.getElementById('progress');
const riddleTextEl= document.getElementById('riddleText');
const feedbackEl  = document.getElementById('feedback');
const nextWrapEl  = document.getElementById('nextWrap');
const scoreLineEl = document.getElementById('scoreLine');
const starsEl     = document.getElementById('stars');
const endTitleEl  = document.getElementById('endTitle');
const endSummaryEl= document.getElementById('endSummary');
const navRight    = document.getElementById('navRight');

let order = [];          // индексы загадок текущей игры
let pos = 0;             // текущая позиция в order
let firstTryCount = 0;   // отгадано с первой попытки
let triedThis = false;   // была ли уже ошибка в текущей загадке

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  ensureAudio();                       // разблокировка звука внутри жеста
  order = shuffle(RIDDLES.map((_, i) => i)).slice(0, GAME_SIZE);
  pos = 0;
  firstTryCount = 0;
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  navRight.classList.remove('hidden');  // показываем «Заново»
  renderRiddle();
}

function renderRiddle() {
  triedThis = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  nextWrapEl.innerHTML = '';

  const r = RIDDLES[order[pos]];
  progressEl.textContent = 'Загадка ' + (pos + 1) + ' из ' + order.length;
  riddleTextEl.textContent = r.q;

  // Перемешиваем варианты, чтобы правильный был в случайном месте.
  const idx = shuffle(r.opts.map((_, i) => i));
  gridEl.innerHTML = '';
  idx.forEach((origIndex) => {
    const opt = r.opts[origIndex];
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'opt';
    const face = document.createElement('span');
    face.className = 'face';
    face.textContent = opt[0];
    const word = document.createElement('span');
    word.className = 'word';
    word.textContent = opt[1];
    cell.appendChild(face);
    cell.appendChild(word);
    cell.addEventListener('click', () => onPick(cell, origIndex === r.a, opt[1]));
    gridEl.appendChild(cell);
  });
}

function onPick(cell, isCorrect, word) {
  ensureAudio();
  if (isCorrect) {
    cell.classList.add('correct', 'locked');
    [...gridEl.children].forEach((c) => {
      c.classList.add('locked');
      if (c !== cell) c.classList.add('dim');
    });
    if (!triedThis) firstTryCount++;
    playGood();
    feedbackEl.textContent = 'Верно! Это ' + word.toLowerCase() + ' 🎉';
    feedbackEl.className = 'feedback good';

    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn';
    nextBtn.textContent = (pos + 1 < order.length) ? 'Дальше ▶' : 'Закончить ✓';
    nextBtn.addEventListener('click', goNext);
    nextWrapEl.innerHTML = '';
    nextWrapEl.appendChild(nextBtn);
  } else {
    triedThis = true;
    playRetry();
    cell.classList.remove('wrong');
    void cell.offsetWidth;            // перезапуск анимации покачивания
    cell.classList.add('wrong');
    feedbackEl.textContent = 'Подумай ещё 🙂';
    feedbackEl.className = 'feedback retry';
  }
}

function goNext() {
  pos++;
  if (pos < order.length) {
    renderRiddle();
  } else {
    showEnd();
  }
}

function showEnd() {
  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  navRight.classList.add('hidden');     // на финале «Заново» не нужен

  const total = order.length;
  let stars, title, summary;
  if (firstTryCount >= total - 2) {
    stars = '⭐⭐⭐'; title = 'Превосходно!';
    summary = 'Почти все загадки с первой попытки — вот это смекалка!';
  } else if (firstTryCount >= Math.ceil(total * 0.6)) {
    stars = '⭐⭐'; title = 'Здорово!';
    summary = 'Очень хороший результат. Ещё разок — и будет три звёздочки!';
  } else {
    stars = '⭐'; title = 'Молодец!';
    summary = 'Ты отгадала все загадки. Чем больше играешь — тем легче!';
  }
  var nm = ''; try { nm = localStorage.getItem('omma_name') || ''; } catch (e) {}
  endTitleEl.textContent = nm ? title.replace(/!$/, ', ' + nm + '!') : title;
  starsEl.textContent = stars;
  endSummaryEl.textContent = summary;
  scoreLineEl.textContent = 'С первой попытки: ' + firstTryCount + ' из ' + total;
  playGood();
  if (window.fireConfetti) fireConfetti();
  if (window.awardStars) awardStars('zagadki', stars.length);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);

/* ---------- Навигация и подтверждение выхода ---------- */
const confirmOverlay = document.getElementById('confirmOverlay');
const confirmTextEl  = document.getElementById('confirmText');
let pendingYes = null;
function askConfirm(msg, onYes) {
  confirmTextEl.textContent = msg;
  pendingYes = onYes;
  confirmOverlay.classList.remove('hidden');
}
document.getElementById('cfYes').addEventListener('click', () => {
  confirmOverlay.classList.add('hidden');
  const fn = pendingYes; pendingYes = null; if (fn) fn();
});
document.getElementById('cfNo').addEventListener('click', () => {
  confirmOverlay.classList.add('hidden'); pendingYes = null;
});

// Игра «на середине»: открыт игровой экран и пройдена хотя бы одна загадка.
function midGame() { return !gameScreen.classList.contains('hidden') && pos > 0; }

document.getElementById('homeBtn').addEventListener('click', (e) => {
  if (midGame()) {
    e.preventDefault();
    askConfirm('Выйти в меню? Эта игра не сохранится.', () => { window.location.href = 'index.html'; });
  }
});
document.getElementById('restartBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Начать заново? Эта игра не сохранится.', startGame);
  else startGame();
});
</script>

  <canvas id="confetti" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;"></canvas>
  <script>
  (function(){
    var cv=document.getElementById('confetti'), cx=cv.getContext('2d'), parts=[], raf=null;
    function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
    window.addEventListener('resize',resize); resize();
    var EMO=['⭐','🌟','💖','💛','✨','🎉','🌸'];
    window.fireConfetti=function(){
      resize();
      for(var i=0;i<40;i++){
        parts.push({x:cv.width*(0.2+Math.random()*0.6), y:cv.height*0.3+(Math.random()-0.5)*60,
          vx:(Math.random()-0.5)*9, vy:-7-Math.random()*7, g:0.28+Math.random()*0.15,
          s:18+Math.random()*16, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3,
          e:EMO[Math.floor(Math.random()*EMO.length)], life:0});
      }
      if(!raf) raf=requestAnimationFrame(step);
    };
    function step(){
      cx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<parts.length;i++){ var p=parts[i];
        p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
        cx.font=p.s+'px "Segoe UI Emoji","Apple Color Emoji",system-ui,sans-serif';
        cx.textAlign='center'; cx.textBaseline='middle';
        cx.globalAlpha=Math.max(0,1-p.life/130);
        cx.fillText(p.e,0,0); cx.restore();
      }
      parts=parts.filter(function(p){return p.life<130 && p.y<cv.height+50;});
      if(parts.length) raf=requestAnimationFrame(step); else { cx.clearRect(0,0,cv.width,cv.height); raf=null; }
    }
  })();
  window.awardStars=function(game,n){try{
    localStorage.setItem('omma_stars_total',(parseInt(localStorage.getItem('omma_stars_total')||'0',10)||0)+n);
    var bk='omma_best_'+game, b=parseInt(localStorage.getItem(bk)||'0',10)||0; if(n>b) localStorage.setItem(bk,n);
    localStorage.setItem('omma_plays_total',(parseInt(localStorage.getItem('omma_plays_total')||'0',10)||0)+1);
  }catch(e){}};
  </script>
