<!DOCTYPE html>
<!--
  Игра «Который час?» — развивающая цель: ОПРЕДЕЛЕНИЕ ВРЕМЕНИ ПО ЧАСАМ.
  Программа 2 класса. На Canvas рисуется циферблат со стрелками (часовая
  и минутная), ребёнок выбирает правильное время из вариантов.
  Три уровня: 1) целые часы; 2) полчаса и четверти; 3) любые 5 минут.
  Навигация как в других играх: верхний бар (🏠 К играм, 🔄 Заново,
  🎚 Уровень), выбор уровня на старте, подтверждение выхода, переключатель
  игр и звёздочки в конце.
  Чистый HTML/CSS/JS, один файл, офлайн, работает по file:// и на iOS.
-->

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>
  :root {
    --bg1: #dbeafe;
    --bg2: #ede9fe;
    --card: #ffffff;
    --text: #1f2937;
    --accent: #2563eb;
    --good: #22c55e;
    --good-bg: #dcfce7;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-user-select: none;

    -webkit-touch-callout: none;
  }
  .screen { width: 100%; max-width: 560px; text-align: center; }
  .hidden { display: none; }

  h1 { font-size: clamp(28px, 6.5vw, 44px); margin: 0 0 10px; }
  .lead { color: #4b5563; font-size: clamp(16px, 3.6vw, 21px); margin: 0 0 28px; }

  .btn {
    display: inline-block;
    border: none; border-radius: 18px;
    padding: 16px 34px;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 700; font-family: inherit;
    color: #fff; background: var(--accent);
    cursor: pointer; box-shadow: 0 8px 20px rgba(37,99,235,0.30);
    touch-action: manipulation; text-decoration: none;
  }
  .btn.secondary { background: #fff; color: var(--accent); box-shadow: 0 6px 16px rgba(37,99,235,0.16); }
  @media (hover: hover) { .btn:hover { filter: brightness(1.05); } }
  .btn:active { transform: scale(0.97); }

  /* верхний бар навигации */
  .topbar {
    width: 100%; max-width: 560px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 14px;
  }

  .navright { display: flex; gap: 8px; }
  .navright.hidden { display: none; }

  .levels { display: flex; flex-direction: column; gap: 14px; align-items: center; }

  /* игровой экран */
  .progress { font-size: clamp(15px, 3.4vw, 19px); color: #6b7280; font-weight: 700; margin-bottom: 8px; }
  .question { font-size: clamp(19px, 4.4vw, 26px); font-weight: 700; margin-bottom: 14px; }
  .clock-wrap {
    background: var(--card); border-radius: 28px; padding: 16px;

  canvas#clock { width: min(280px, 70vw); height: auto; display: block; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .opt {
    background: var(--card); border: 4px solid transparent; border-radius: 20px;
    padding: 20px 12px; min-height: 76px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(28px, 7vw, 40px);
    color: var(--text); cursor: pointer;
    box-shadow: 0 8px 20px rgba(37,99,235,0.12);
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    touch-action: manipulation; font-variant-numeric: tabular-nums;
  }
  @media (hover: hover) { .opt:hover { transform: translateY(-3px); border-color: var(--accent); } }
  .opt:active { transform: scale(0.97); }
  .opt.correct { background: var(--good-bg); border-color: var(--good); animation: pop 0.4s ease; }
  .opt.wrong { animation: shake 0.45s ease; }
  .opt.locked { pointer-events: none; }
  .opt.dim { opacity: 0.45; }

  @keyframes pop { 0%{transform:scale(1);} 45%{transform:scale(1.10);} 100%{transform:scale(1);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-9px);} 40%{transform:translateX(9px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }

  .feedback { min-height: 40px; margin-top: 18px; font-size: clamp(19px, 4.2vw, 25px); font-weight: 700; }
  .feedback.good { color: var(--good); }
  .feedback.retry { color: #d97706; }
  .next-wrap { min-height: 70px; margin-top: 12px; }

  .final-emoji { font-size: 72px; margin-bottom: 6px; }
  .stars { font-size: clamp(40px, 11vw, 64px); letter-spacing: 6px; margin: 8px 0 4px; animation: pop 0.5s ease; }
  .score-line { font-size: clamp(17px, 3.8vw, 22px); color: #4b5563; font-weight: 700; margin: 8px 0 26px; }
  .final-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  .switcher { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
  .switcher-label { font-size: clamp(15px,3.4vw,18px); font-weight: 700; color: #6b7280; }
  .game-pill { font-size: 30px; text-decoration: none; line-height: 1; background: #fff; border-radius: 16px; padding: 8px 12px; box-shadow: 0 6px 16px rgba(37,99,235,0.14); touch-action: manipulation; }
  .game-pill:active { transform: scale(0.94); }

  /* подтверждение выхода */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .overlay.hidden { display: none; }
  .confirm-box { background: #fff; border-radius: 24px; padding: 26px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .confirm-box p { font-size: clamp(18px,4.4vw,22px); font-weight: 700; margin: 0 0 20px; }
  .confirm-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cbtn { font-family: inherit; font-weight: 700; font-size: clamp(16px,4vw,20px); border: none; border-radius: 14px; padding: 14px 26px; cursor: pointer; touch-action: manipulation; }
  .cbtn-yes { background: var(--accent); color: #fff; }
  .cbtn-no  { background: #eee; color: #1f2937; }
</style>

<body>

  <!-- Экран старта: выбор уровня -->
  <div id="startScreen" class="screen">

<script>
"use strict";

/* ---------- Параметры уровней ----------
   level 1 — целые часы (минуты = 0);
   level 2 — 0/15/30/45;
   level 3 — любые 5 минут (0,5,…,55).
*/
const ALLOWED_MIN = { 1: [0], 2: [0, 15, 30, 45], 3: [0,5,10,15,20,25,30,35,40,45,50,55] };
const LEVEL_NAMES = { 1: 'Целые часы', 2: 'Полчаса и четверти', 3: 'Любые 5 минут' };
const GAME_SIZE = 10;

const startScreen = document.getElementById('startScreen');
const gameScreen  = document.getElementById('gameScreen');
const endScreen   = document.getElementById('endScreen');
const gridEl      = document.getElementById('grid');
const progressEl  = document.getElementById('progress');
const feedbackEl  = document.getElementById('feedback');
const nextWrapEl  = document.getElementById('nextWrap');
const scoreLineEl = document.getElementById('scoreLine');
const starsEl     = document.getElementById('stars');
const endTitleEl  = document.getElementById('endTitle');
const endSummaryEl= document.getElementById('endSummary');
const navRight    = document.getElementById('navRight');
const canvas      = document.getElementById('clock');

let pos = 0;
let firstTryCount = 0;
let triedThis = false;
let currentLevel = 1;
let answer = null;     // { h, m } текущего вопроса

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function fmt(t) { return t.h + ':' + String(t.m).padStart(2, '0'); }
function wrapHour(h) { return ((h - 1) % 12 + 12) % 12 + 1; }

function genTime(level) {
  const mins = ALLOWED_MIN[level];
  return { h: randInt(1, 12), m: mins[randInt(0, mins.length - 1)] };
}

// Готовим вопрос: правильное время + 3 правдоподобные обманки.
function makeQuestion(level) {
  const ans = genTime(level);
  const opts = [ans];
  const seen = new Set([fmt(ans)]);
  let guard = 0;
  while (opts.length < 4 && guard++ < 100) {
    let t;
    const r = Math.random();
    if (r < 0.45) {                                   // путаница в часе
      t = { h: wrapHour(ans.h + (Math.random() < 0.5 ? 1 : -1)), m: ans.m };
    } else if (r < 0.75 && ALLOWED_MIN[level].length > 1) { // путаница в минутах
      t = { h: ans.h, m: ALLOWED_MIN[level][randInt(0, ALLOWED_MIN[level].length - 1)] };
    } else {                                          // совсем другое время
      t = genTime(level);
    }
    if (!seen.has(fmt(t))) { seen.add(fmt(t)); opts.push(t); }
  }
  return { ans, opts: shuffle(opts) };
}

/* ---------- Рисование циферблата на Canvas ---------- */
const ctx = canvas.getContext('2d');
const SIZE = 300;                                    // логический размер
(function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = SIZE * dpr;
  canvas.height = SIZE * dpr;
  ctx.scale(dpr, dpr);
})();

function drawHand(angle, length, width, color) {
  const cx = SIZE / 2, cy = SIZE / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.lineCap = 'round';
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 10);
  ctx.lineTo(0, -length);
  ctx.stroke();
  ctx.restore();
}

function drawClock(h, m) {
  const cx = SIZE / 2, cy = SIZE / 2, R = SIZE / 2 - 8;
  ctx.clearRect(0, 0, SIZE, SIZE);

  // циферблат
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, 2 * Math.PI);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = 7;
  ctx.strokeStyle = '#2563eb';
  ctx.stroke();

  // минутные риски и цифры 1..12
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * 2 * Math.PI;
    const outer = R - 6;
    const inner = (i % 5 === 0) ? R - 18 : R - 12;
    ctx.beginPath();
    ctx.moveTo(cx + Math.sin(a) * outer, cy - Math.cos(a) * outer);
    ctx.lineTo(cx + Math.sin(a) * inner, cy - Math.cos(a) * inner);
    ctx.lineWidth = (i % 5 === 0) ? 3 : 1;
    ctx.strokeStyle = '#94a3b8';
    ctx.stroke();
  }
  ctx.fillStyle = '#1f2937';
  ctx.font = 'bold 26px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let n = 1; n <= 12; n++) {
    const a = (n / 12) * 2 * Math.PI;
    const rx = cx + Math.sin(a) * (R - 38);
    const ry = cy - Math.cos(a) * (R - 38);
    ctx.fillText(String(n), rx, ry);
  }

  // стрелки: часовая (короткая, толстая) и минутная (длинная)
  const hourAngle = ((h % 12) + m / 60) / 12 * 2 * Math.PI;
  const minAngle  = (m / 60) * 2 * Math.PI;
  drawHand(hourAngle, R * 0.50, 8, '#1f2937');
  drawHand(minAngle,  R * 0.78, 5, '#2563eb');

  // центр
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, 2 * Math.PI);
  ctx.fillStyle = '#2563eb';
  ctx.fill();
}

/* ---------- Логика игры ---------- */
function showStart() {
  gameScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
  navRight.classList.add('hidden');
}

function startGame(level) {
  currentLevel = level;
  pos = 0;
  firstTryCount = 0;
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  navRight.classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  triedThis = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  nextWrapEl.innerHTML = '';

  progressEl.textContent = LEVEL_NAMES[currentLevel] + ' · Вопрос ' + (pos + 1) + ' из ' + GAME_SIZE;

  const q = makeQuestion(currentLevel);
  answer = q.ans;
  drawClock(answer.h, answer.m);

  gridEl.innerHTML = '';
  q.opts.forEach((t) => {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'opt';
    cell.textContent = fmt(t);
    cell.addEventListener('click', () => onPick(cell, fmt(t) === fmt(answer)));
    gridEl.appendChild(cell);
  });
}

function onPick(cell, isCorrect) {
  if (isCorrect) {
    cell.classList.add('correct', 'locked');
    [...gridEl.children].forEach((c) => { c.classList.add('locked'); if (c !== cell) c.classList.add('dim'); });
    if (!triedThis) firstTryCount++;
    playGood();
    feedbackEl.textContent = 'Верно! ' + fmt(answer) + ' 🎉';
    feedbackEl.className = 'feedback good';

    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn';
    nextBtn.textContent = (pos + 1 < GAME_SIZE) ? 'Дальше ▶' : 'Закончить ✓';
    nextBtn.addEventListener('click', goNext);
    nextWrapEl.innerHTML = '';
    nextWrapEl.appendChild(nextBtn);
  } else {
    triedThis = true;
    playRetry();
    cell.classList.remove('wrong');
    void cell.offsetWidth;
    cell.classList.add('wrong');
    feedbackEl.textContent = 'Посмотри ещё раз 🙂';
    feedbackEl.className = 'feedback retry';
  }
}

function goNext() {
  pos++;
  if (pos < GAME_SIZE) renderQuestion();
  else showEnd();
}

function showEnd() {
  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  navRight.classList.add('hidden');

  const total = GAME_SIZE;
  let stars, title, summary;
  if (firstTryCount >= total - 1) {
    stars = '⭐⭐⭐'; title = 'Превосходно!';
    summary = 'Почти всё с первой попытки — ты отлично читаешь часы!';
  } else if (firstTryCount >= Math.ceil(total * 0.6)) {
    stars = '⭐⭐'; title = 'Здорово!';
    summary = 'Очень хороший результат. Ещё разок — и будет три звёздочки!';
  } else {
    stars = '⭐'; title = 'Молодец!';
    summary = 'Ты прошёл все вопросы. Чем больше тренируешься — тем легче!';
  }
  var nm = ''; try { nm = localStorage.getItem('omma_name') || ''; } catch (e) {}
  endTitleEl.textContent = nm ? title.replace(/!$/, ', ' + nm + '!') : title;
  starsEl.textContent = stars;
  endSummaryEl.textContent = summary;
  scoreLineEl.textContent = 'Уровень «' + LEVEL_NAMES[currentLevel] + '». С первой попытки: ' + firstTryCount + ' из ' + total;
  playGood();
  if (window.fireConfetti) fireConfetti();
  if (window.awardStars) awardStars('chasy', stars.length);
}

/* ---------- Звук: один переиспользуемый AudioContext (правило iOS) ---------- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freqs, dur, type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  freqs.forEach((f, i) => {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    const t0 = now + i * 0.12;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  });
}
const playGood  = () => tone([523.25, 659.25, 783.99], 0.22);
const playRetry = () => tone([330, 247], 0.16, 'triangle');

/* ---------- Навигация и подтверждение выхода ---------- */
const confirmOverlay = document.getElementById('confirmOverlay');
const confirmTextEl  = document.getElementById('confirmText');
let pendingYes = null;
function askConfirm(msg, onYes) { confirmTextEl.textContent = msg; pendingYes = onYes; confirmOverlay.classList.remove('hidden'); }
document.getElementById('cfYes').addEventListener('click', () => { confirmOverlay.classList.add('hidden'); const fn = pendingYes; pendingYes = null; if (fn) fn(); });
document.getElementById('cfNo').addEventListener('click', () => { confirmOverlay.classList.add('hidden'); pendingYes = null; });

function midGame() { return !gameScreen.classList.contains('hidden') && pos > 0; }

document.querySelectorAll('.level-btn').forEach((b) => {
  b.addEventListener('click', () => { ensureAudio(); startGame(parseInt(b.getAttribute('data-level'), 10)); });
});
document.getElementById('homeBtn').addEventListener('click', (e) => {
  if (midGame()) { e.preventDefault(); askConfirm('Выйти в меню? Эта игра не сохранится.', () => { window.location.href = 'index.html'; }); }
});
document.getElementById('levelBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Сменить уровень? Эта игра не сохранится.', showStart); else showStart();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Начать заново? Эта игра не сохранится.', () => startGame(currentLevel)); else startGame(currentLevel);
});
document.getElementById('againBtn').addEventListener('click', () => startGame(currentLevel));
document.getElementById('changeLevelBtn').addEventListener('click', showStart);
</script>

  <canvas id="confetti" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;"></canvas>
  <script>
  (function(){
    var cv=document.getElementById('confetti'), cx=cv.getContext('2d'), parts=[], raf=null;
    function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
    window.addEventListener('resize',resize); resize();
    var EMO=['⭐','🌟','💖','💛','✨','🎉','🌸'];
    window.fireConfetti=function(){
      resize();
      for(var i=0;i<40;i++){
        parts.push({x:cv.width*(0.2+Math.random()*0.6), y:cv.height*0.3+(Math.random()-0.5)*60,
          vx:(Math.random()-0.5)*9, vy:-7-Math.random()*7, g:0.28+Math.random()*0.15,
          s:18+Math.random()*16, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3,
          e:EMO[Math.floor(Math.random()*EMO.length)], life:0});
      }
      if(!raf) raf=requestAnimationFrame(step);
    };
    function step(){
      cx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<parts.length;i++){ var p=parts[i];
        p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
        cx.font=p.s+'px "Segoe UI Emoji","Apple Color Emoji",system-ui,sans-serif';
        cx.textAlign='center'; cx.textBaseline='middle';
        cx.globalAlpha=Math.max(0,1-p.life/130);
        cx.fillText(p.e,0,0); cx.restore();
      }
      parts=parts.filter(function(p){return p.life<130 && p.y<cv.height+50;});
      if(parts.length) raf=requestAnimationFrame(step); else { cx.clearRect(0,0,cv.width,cv.height); raf=null; }
    }
  })();
  window.awardStars=function(game,n){try{
    localStorage.setItem('omma_stars_total',(parseInt(localStorage.getItem('omma_stars_total')||'0',10)||0)+n);
    var bk='omma_best_'+game, b=parseInt(localStorage.getItem(bk)||'0',10)||0; if(n>b) localStorage.setItem(bk,n);
    localStorage.setItem('omma_plays_total',(parseInt(localStorage.getItem('omma_plays_total')||'0',10)||0)+1);
  }catch(e){}};
  </script>
</body>
