<!DOCTYPE html>
<!--
  Игра «Найди лишнее» — развивающая цель: ЛОГИКА и КЛАССИФИКАЦИЯ.
  Ребёнок учится находить общий признак у группы и замечать предмет
  или слово, которое из неё выпадает. Пять типов заданий:
    1) «Найди лишнее»   — выбери, что не подходит;
    2) «Найди похожее»  — сверху картинка, подбери из той же категории;
    3) «Что общего?»    — выбери категорию, объединяющую три предмета;
    4) «Что дальше?»    — продолжи ряд;
    5) «Ответь на вопрос» — конкретный вопрос про предметы или слова.
  Банк 100 задач, разбит на 3 уровня сложности (level: 1 лёгкий,
  2 средний, 3 сложный). Перед стартом ребёнок выбирает уровень;
  каждая игра — 15 случайных задач выбранного уровня, повторяется редко.
  Чистый HTML/CSS/JS, один файл, офлайн, работает по file:// и на iOS.
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Найди лишнее">
<meta name="mobile-web-app-capable" content="yes">
<title>Найди лишнее</title>
<style>
  :root {
    --bg1: #fef3c7;
    --bg2: #ddd6fe;
    --card: #ffffff;
    --text: #1f2937;
    --accent: #7c3aed;
    --good: #22c55e;
    --good-bg: #dcfce7;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;  /* убираем серую вспышку iOS */
  }
  html { -webkit-text-size-adjust: 100%; }     /* iOS не раздувает шрифт */
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    /* без выделения текста и меню при удержании пальца */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .screen { width: 100%; max-width: 640px; text-align: center; }
  .hidden { display: none; }

  h1 { font-size: clamp(30px, 7vw, 48px); margin: 0 0 10px; }
  .lead { color: #4b5563; font-size: clamp(16px, 3.6vw, 21px); margin: 0 0 28px; }

  .btn {
    display: inline-block;
    border: none;
    border-radius: 18px;
    padding: 16px 34px;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.30);
    touch-action: manipulation;          /* мгновенный тап без зума */
    text-decoration: none;
  }
  .btn.secondary {
    background: #fff;
    color: var(--accent);
    box-shadow: 0 6px 16px rgba(124, 58, 237, 0.16);
  }
  @media (hover: hover) {
    .btn:hover { filter: brightness(1.05); }
  }
  .btn:active { transform: scale(0.97); }

  /* ---- выбор уровня на старте ---- */
  .levels { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .level-btn { width: 280px; max-width: 100%; }
  .level-hint { font-size: clamp(13px, 3vw, 16px); font-weight: 600; opacity: 0.85; }

  /* ---- игровой экран ---- */
  .progress {
    font-size: clamp(15px, 3.4vw, 19px);
    color: #6b7280;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .question {
    font-size: clamp(20px, 4.6vw, 28px);
    font-weight: 700;
    margin-bottom: 18px;
  }
  /* Подсказка над сеткой: одна крупная картинка ИЛИ ряд из нескольких. */
  .prompt {
    margin: 0 auto 18px;
    text-align: center;
    line-height: 1;
  }
  .prompt:empty { display: none; }
  .prompt.prompt-big {
    font-size: clamp(56px, 14vw, 84px);
  }
  .prompt.prompt-row {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--card);
    border-radius: 22px;
    padding: 14px 20px;
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.12);
    max-width: 100%;
  }
  .pf { font-size: clamp(22px, 5vw, 32px); font-weight: 700; }
  .pf.big { font-size: clamp(40px, 9vw, 60px); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .opt {
    background: var(--card);
    border: 4px solid transparent;
    border-radius: 22px;
    padding: 22px 12px;
    min-height: 116px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.12);
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    touch-action: manipulation;
    word-break: break-word;
  }
  .opt .face { font-size: clamp(26px, 6vw, 36px); }
  .opt.big .face { font-size: clamp(52px, 13vw, 78px); }
  @media (hover: hover) {
    .opt:hover { transform: translateY(-3px); border-color: var(--accent); }
  }
  .opt:active { transform: scale(0.97); }
  .opt.correct {
    background: var(--good-bg);
    border-color: var(--good);
    animation: pop 0.4s ease;
  }
  .opt.wrong { animation: shake 0.45s ease; }
  .opt.locked { pointer-events: none; }
  .opt.dim { opacity: 0.45; }

  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.10); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .feedback {
    min-height: 64px;
    margin-top: 20px;
    font-size: clamp(19px, 4.2vw, 25px);
    font-weight: 700;
  }
  .feedback.good { color: var(--good); }
  .feedback.retry { color: #d97706; }
  .why {
    font-size: clamp(15px, 3.4vw, 19px);
    font-weight: 600;
    color: #4b5563;
    margin-top: 6px;
  }
  .next-wrap { min-height: 70px; margin-top: 16px; }

  .final-emoji { font-size: 72px; margin-bottom: 6px; }
  .stars {
    font-size: clamp(40px, 11vw, 64px);
    letter-spacing: 6px;
    margin: 8px 0 4px;
    animation: pop 0.5s ease;
  }
  .score-line {
    font-size: clamp(17px, 3.8vw, 22px);
    color: #4b5563;
    font-weight: 700;
    margin: 8px 0 26px;
  }
  .final-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  /* верхний бар навигации */
  .topbar {
    width: 100%; max-width: 640px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 16px;
  }
  .navbtn {
    font-family: inherit; font-weight: 700; font-size: clamp(14px, 3.4vw, 17px);
    border: none; background: #fff; color: var(--accent);
    border-radius: 999px; padding: 9px 16px; cursor: pointer;
    text-decoration: none; box-shadow: 0 4px 12px rgba(124,58,237,0.14);
    touch-action: manipulation; white-space: nowrap;
  }
  .navbtn:active { transform: scale(0.96); }
  .navright { display: flex; gap: 8px; }
  .navright.hidden { display: none; }   /* перебиваем общий .hidden по специфичности */
  /* переключатель игр на финальном экране */
  .switcher {
    margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: center;
  }
  .switcher-label { font-size: clamp(15px,3.4vw,18px); font-weight: 700; color: #6b7280; }
  .game-pill {
    font-size: 30px; text-decoration: none; line-height: 1;
    background: #fff; border-radius: 16px; padding: 8px 12px;
    box-shadow: 0 6px 16px rgba(124,58,237,0.14); touch-action: manipulation;
  }
  .game-pill:active { transform: scale(0.94); }
  /* подтверждение выхода */
  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .overlay.hidden { display: none; }
  .confirm-box {
    background: #fff; border-radius: 24px; padding: 26px 24px;
    max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .confirm-box p { font-size: clamp(18px,4.4vw,22px); font-weight: 700; margin: 0 0 20px; }
  .confirm-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cbtn {
    font-family: inherit; font-weight: 700; font-size: clamp(16px,4vw,20px);
    border: none; border-radius: 14px; padding: 14px 26px; cursor: pointer; touch-action: manipulation;
  }
  .cbtn-yes { background: var(--accent); color: #fff; }
  .cbtn-no  { background: #eee; color: #1f2937; }
</style>
</head>
<body>

  <header class="topbar">
    <a class="navbtn" id="homeBtn" href="index.html">🏠 К играм</a>
    <div class="navright hidden" id="navRight">
      <button class="navbtn" id="levelBtn">🎚️ Уровень</button>
      <button class="navbtn" id="restartBtn">🔄 Заново</button>
    </div>
  </header>

  <!-- Экран старта: выбор уровня -->
  <div id="startScreen" class="screen">
    <div class="final-emoji">🔍</div>
    <h1>Найди лишнее</h1>
    <p class="lead">Выбери уровень — и поехали!</p>
    <div class="levels">
      <button class="btn level-btn" data-level="1">🙂 Лёгкий</button>
      <button class="btn level-btn" data-level="2">😎 Средний</button>
      <button class="btn level-btn" data-level="3">🤓 Сложный</button>
    </div>
  </div>

  <!-- Игровой экран -->
  <div id="gameScreen" class="screen hidden">
    <div class="progress" id="progress">Задание 1 из 15</div>
    <div class="question" id="question">Что здесь лишнее?</div>
    <div class="prompt" id="prompt"></div>
    <div class="grid" id="grid"></div>
    <div class="feedback" id="feedback"></div>
    <div class="next-wrap" id="nextWrap"></div>
  </div>

  <!-- Финальный экран -->
  <div id="endScreen" class="screen hidden">
    <div class="final-emoji">🌟</div>
    <h1 id="endTitle">Молодец!</h1>
    <div class="stars" id="stars"></div>
    <p class="lead" id="endSummary">Ты прошла все задания!</p>
    <p class="score-line" id="scoreLine"></p>
    <div class="final-buttons">
      <button class="btn" id="againBtn">Играть ещё раз 🔁</button>
      <button class="btn secondary" id="changeLevelBtn">Сменить уровень 🎚️</button>
    </div>
    <div class="switcher">
      <span class="switcher-label">Другая игра:</span>
      <a class="game-pill" href="matematika.html" title="Математика">🧮</a>
      <a class="game-pill" href="pamyat.html" title="Память">🧠</a>
      <a class="game-pill" href="zagadki.html" title="Загадки">🤔</a>
      <a class="game-pill" href="chasy.html" title="Который час?">🕐</a>
      <a class="game-pill" href="magazin.html" title="Магазин и сдача">🛒</a>
      <a class="game-pill" href="labirint.html" title="Лабиринт">🌀</a>
    </div>
  </div>

  <div class="overlay hidden" id="confirmOverlay">
    <div class="confirm-box">
      <p id="confirmText">Выйти? Прогресс не сохранится.</p>
      <div class="confirm-actions">
        <button class="cbtn cbtn-yes" id="cfYes">Да</button>
        <button class="cbtn cbtn-no" id="cfNo">Остаться</button>
      </div>
    </div>
  </div>

<script>
"use strict";

/* ---------- Данные: банк из 100 заданий, 3 уровня ----------
   Каждое задание описано полями:
     level   — 1 (лёгкий), 2 (средний), 3 (сложный);
     type    — 'odd' | 'match' | 'common' | 'sequence' | 'attribute';
     q       — вопрос над сеткой;
     prompt  — что показать НАД сеткой (опционально):
                 { kind:'big', items:['🐶'] }                — одна крупная картинка;
                 { kind:'row', items:[...], big:true|false } — ряд предметов/слов;
     items   — 4 варианта ответа в сетке;
     answer  — индекс правильного варианта (до перемешивания);
     big     — true → крупный размер эмодзи в сетке;
     why     — короткое пояснение, показывается после правильного ответа.
   В каждой игре берётся GAME_SIZE случайных задач выбранного уровня.
*/
const QUESTIONS = [
  /* ===================== УРОВЕНЬ 1 — ЛЁГКИЙ (33) ===================== */
  // — Найди лишнее
  { level:1, type:'odd', q:'Что здесь лишнее?', items:['🐶','🐱','🐟','🍕'], answer:3, big:true, why:'Пицца — это еда, а не животное.' },
  { level:1, type:'odd', q:'Что здесь лишнее?', items:['🍎','🍌','🍇','🚗'], answer:3, big:true, why:'Машина — это не фрукт.' },
  { level:1, type:'odd', q:'Что здесь лишнее?', items:['🔴','🔵','🟡','🔺'], answer:3, big:true, why:'Треугольник — не круг, а остальные круглые.' },
  { level:1, type:'odd', q:'Что здесь лишнее?', items:['🐝','🦋','🐞','🌷'], answer:3, big:true, why:'Тюльпан — это цветок, а остальные — насекомые.' },
  { level:1, type:'odd', q:'Что здесь лишнее?', items:['🚗','🚌','🚲','🏠'], answer:3, big:true, why:'Дом — это не транспорт.' },
  { level:1, type:'odd', q:'Что здесь лишнее?', items:['🐶','🐱','🐰','🌳'], answer:3, big:true, why:'Дерево — это не животное.' },
  { level:1, type:'odd', q:'Что здесь лишнее?', items:['⚽','🏀','🎾','🍎'], answer:3, big:true, why:'Яблоко — это не мяч.' },
  { level:1, type:'odd', q:'Что здесь лишнее?', items:['🌷','🌹','🌻','🐝'], answer:3, big:true, why:'Пчела — это насекомое, а остальные — цветы.' },
  // — Найди похожее
  { level:1, type:'match', q:'Что подходит к этой картинке?', prompt:{kind:'big',items:['🐶']}, items:['🐱','🚗','🌳','☂️'], answer:0, big:true, why:'Кот и собака — домашние животные.' },
  { level:1, type:'match', q:'Что подходит к этой картинке?', prompt:{kind:'big',items:['🍎']}, items:['🍌','🥕','🚗','☂️'], answer:0, big:true, why:'Яблоко и банан — фрукты.' },
  { level:1, type:'match', q:'Что подходит к этой картинке?', prompt:{kind:'big',items:['🚗']}, items:['🚌','🌳','🐘','🍕'], answer:0, big:true, why:'Машина и автобус — транспорт.' },
  { level:1, type:'match', q:'Что подходит к этой картинке?', prompt:{kind:'big',items:['🎸']}, items:['🥁','🎨','🚲','🍕'], answer:0, big:true, why:'Гитара и барабан — музыкальные инструменты.' },
  { level:1, type:'match', q:'Что подходит к этой картинке?', prompt:{kind:'big',items:['⚽']}, items:['🏀','🪑','🐘','🌷'], answer:0, big:true, why:'Футбольный и баскетбольный — мячи.' },
  { level:1, type:'match', q:'Что подходит к этой картинке?', prompt:{kind:'big',items:['🌷']}, items:['🌹','🌳','🐶','⛅'], answer:0, big:true, why:'Тюльпан и роза — цветы.' },
  // — Что общего?
  { level:1, type:'common', q:'Что у них общего?', prompt:{kind:'row',items:['🍎','🍌','🍇'],big:true}, items:['Фрукты','Овощи','Цветы','Птицы'], answer:0, big:false, why:'Яблоко, банан и виноград — фрукты.' },
  { level:1, type:'common', q:'Что у них общего?', prompt:{kind:'row',items:['🐶','🐱','🐰'],big:true}, items:['Животные','Деревья','Числа','Фигуры'], answer:0, big:false, why:'Собака, кот и кролик — животные.' },
  { level:1, type:'common', q:'Что у них общего?', prompt:{kind:'row',items:['🔴','🔵','🟢'],big:true}, items:['Круги','Треугольники','Числа','Буквы'], answer:0, big:false, why:'Все три — круги разного цвета.' },
  { level:1, type:'common', q:'Что у них общего?', prompt:{kind:'row',items:['🚗','🚌','🚲'],big:true}, items:['Транспорт','Игрушки','Еда','Звуки'], answer:0, big:false, why:'Это всё — транспорт.' },
  { level:1, type:'common', q:'Что у них общего?', prompt:{kind:'row',items:['🌷','🌹','🌻'],big:true}, items:['Цветы','Деревья','Грибы','Камни'], answer:0, big:false, why:'Тюльпан, роза и подсолнух — цветы.' },
  { level:1, type:'common', q:'Что у них общего?', prompt:{kind:'row',items:['🐝','🦋','🐞'],big:true}, items:['Насекомые','Птицы','Цветы','Рыбы'], answer:0, big:false, why:'Пчела, бабочка и божья коровка — насекомые.' },
  // — Что дальше?
  { level:1, type:'sequence', q:'Что идёт дальше?', prompt:{kind:'row',items:['🔴','🔵','🔴','🔵','❓'],big:true}, items:['🔴','🔵','🟡','🟢'], answer:0, big:true, why:'Красный и синий чередуются.' },
  { level:1, type:'sequence', q:'Что идёт дальше?', prompt:{kind:'row',items:['1','2','3','4','❓'],big:true}, items:['5','6','7','8'], answer:0, big:false, why:'Числа идут по одному.' },
  { level:1, type:'sequence', q:'Что идёт дальше?', prompt:{kind:'row',items:['🔺','🔵','🔺','🔵','❓'],big:true}, items:['🔺','🔵','🟢','⬛'], answer:0, big:true, why:'Треугольник и круг чередуются.' },
  { level:1, type:'sequence', q:'Что идёт дальше?', prompt:{kind:'row',items:['А','Б','В','Г','❓'],big:true}, items:['Д','Е','Ж','А'], answer:0, big:false, why:'Буквы алфавита по порядку.' },
  { level:1, type:'sequence', q:'Что идёт дальше?', prompt:{kind:'row',items:['2','4','6','8','❓'],big:true}, items:['10','9','11','12'], answer:0, big:false, why:'Каждый раз прибавляем 2.' },
  { level:1, type:'sequence', q:'Что идёт дальше?', prompt:{kind:'row',items:['🐶','🐱','🐶','🐱','❓'],big:true}, items:['🐶','🐱','🐰','🐯'], answer:0, big:true, why:'Собака и кот чередуются.' },
  // — Ответь на вопрос
  { level:1, type:'attribute', q:'Кто живёт в воде?', items:['🐶','🐱','🐟','🐰'], answer:2, big:true, why:'Рыбы живут в воде.' },
  { level:1, type:'attribute', q:'Что можно есть?', items:['🍎','🚗','🪑','☂️'], answer:0, big:true, why:'Яблоко — это еда.' },
  { level:1, type:'attribute', q:'Чем рисуют?', items:['🖌️','🔑','🍴','⌚'], answer:0, big:true, why:'Кисточкой рисуют.' },
  { level:1, type:'attribute', q:'Что бывает зимой?', items:['☀️','❄️','🌷','🌻'], answer:1, big:true, why:'Снежинка — зимой.' },
  { level:1, type:'attribute', q:'Кто умеет летать?', items:['🐦','🐟','🐘','🐢'], answer:0, big:true, why:'Птица умеет летать.' },
  { level:1, type:'attribute', q:'Что светит ночью?', items:['🌙','☀️','🌳','🏠'], answer:0, big:true, why:'Луна светит ночью.' },
  { level:1, type:'attribute', q:'Что круглое?', items:['⚽','📚','🪑','🚪'], answer:0, big:true, why:'Мяч — круглый.' },

const LEVEL_NAMES = { 1: 'Лёгкий', 2: 'Средний', 3: 'Сложный' };

/* ---------- Звук: один переиспользуемый AudioContext (правило iOS) ---------- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freqs, dur, type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  freqs.forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = f;
    const t0 = now + i * 0.12;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  });
}
const playGood  = () => tone([523.25, 659.25, 783.99], 0.22);          // до-ми-соль вверх
const playRetry = () => tone([330, 247], 0.16, 'triangle');            // мягко вниз, не резко

/* ---------- Логика игры ---------- */
const GAME_SIZE = 15;          // сколько заданий показываем за одну игру

const startScreen = document.getElementById('startScreen');
const gameScreen  = document.getElementById('gameScreen');
const endScreen   = document.getElementById('endScreen');
const gridEl      = document.getElementById('grid');
const progressEl  = document.getElementById('progress');
const questionEl  = document.getElementById('question');
const promptEl    = document.getElementById('prompt');
const feedbackEl  = document.getElementById('feedback');
const nextWrapEl  = document.getElementById('nextWrap');
const scoreLineEl = document.getElementById('scoreLine');
const starsEl     = document.getElementById('stars');
const endTitleEl  = document.getElementById('endTitle');
const endSummaryEl= document.getElementById('endSummary');
const navRight    = document.getElementById('navRight');

let order = [];          // индексы заданий текущей игры (перемешаны, обрезаны)
let pos = 0;             // текущая позиция в order
let firstTryCount = 0;   // решено с первой попытки
let triedThis = false;   // была ли уже ошибка в текущем задании
let currentLevel = 1;    // выбранный уровень сложности

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showStart() {
  gameScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
  navRight.classList.add('hidden');     // в баре остаётся только «🏠 К играм»
}

function startGame(level) {
  ensureAudio();                       // разблокировка звука внутри жеста
  currentLevel = level;
  // Берём только задания выбранного уровня и выбираем GAME_SIZE случайных.
  const pool = QUESTIONS.map((_, i) => i).filter((i) => QUESTIONS[i].level === level);
  order = shuffle(pool).slice(0, GAME_SIZE);
  pos = 0;
  firstTryCount = 0;
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  navRight.classList.remove('hidden');  // показываем «Уровень» и «Заново»
  renderQuestion();
}

function renderQuestion() {
  triedThis = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  nextWrapEl.innerHTML = '';

  const q = QUESTIONS[order[pos]];
  progressEl.textContent = LEVEL_NAMES[currentLevel] + ' · Задание ' + (pos + 1) + ' из ' + order.length;
  questionEl.textContent = q.q || 'Что здесь лишнее?';

  // Подсказка над сеткой: одна большая картинка («match») или ряд («common»/«sequence»).
  promptEl.className = 'prompt';
  promptEl.innerHTML = '';
  if (q.prompt) {
    if (q.prompt.kind === 'big') {
      promptEl.classList.add('prompt-big');
      promptEl.textContent = q.prompt.items[0];
    } else if (q.prompt.kind === 'row') {
      promptEl.classList.add('prompt-row');
      q.prompt.items.forEach((it) => {
        const s = document.createElement('span');
        s.className = 'pf' + (q.prompt.big ? ' big' : '');
        s.textContent = it;
        promptEl.appendChild(s);
      });
    }
  }

  // Перемешиваем позиции вариантов в сетке, чтобы правильный был в случайном месте.
  const idx = shuffle(q.items.map((_, i) => i));
  gridEl.innerHTML = '';
  idx.forEach((origIndex) => {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'opt' + (q.big ? ' big' : '');
    const face = document.createElement('span');
    face.className = 'face';
    face.textContent = q.items[origIndex];
    cell.appendChild(face);
    cell.addEventListener('click', () => onPick(cell, origIndex === q.answer, q));
    gridEl.appendChild(cell);
  });
}

function onPick(cell, isCorrect, q) {
  ensureAudio();
  if (isCorrect) {
    cell.classList.add('correct', 'locked');
    // блокируем остальные карточки
    [...gridEl.children].forEach((c) => {
      c.classList.add('locked');
      if (c !== cell) c.classList.add('dim');
    });
    if (!triedThis) firstTryCount++;
    playGood();
    feedbackEl.textContent = 'Молодец! 🎉';
    feedbackEl.className = 'feedback good';
    const why = document.createElement('div');
    why.className = 'why';
    why.textContent = q.why;
    feedbackEl.appendChild(why);

    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn';
    nextBtn.textContent = (pos + 1 < order.length) ? 'Дальше ▶' : 'Закончить ✓';
    nextBtn.addEventListener('click', goNext);
    nextWrapEl.innerHTML = '';
    nextWrapEl.appendChild(nextBtn);
  } else {
    triedThis = true;
    playRetry();
    cell.classList.remove('wrong');
    void cell.offsetWidth;            // перезапуск анимации покачивания
    cell.classList.add('wrong');
    feedbackEl.textContent = 'Попробуй ещё раз 🙂';
    feedbackEl.className = 'feedback retry';
  }
}

function goNext() {
  pos++;
  if (pos < order.length) {
    renderQuestion();
  } else {
    showEnd();
  }
}

function showEnd() {
  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  navRight.classList.add('hidden');     // на финале бар без «Уровень»/«Заново»

  const total = order.length;
  // звёзды по числу заданий, решённых с первой попытки (мягко, без «проигрыша»)
  let stars, title, summary;
  if (firstTryCount >= total - 2) {
    stars = '⭐⭐⭐'; title = 'Превосходно!';
    summary = 'Почти всё с первой попытки — ты настоящий знаток!';
  } else if (firstTryCount >= Math.ceil(total * 0.6)) {
    stars = '⭐⭐'; title = 'Здорово!';
    summary = 'Очень хороший результат. Ещё разок — и будет три звёздочки!';
  } else {
    stars = '⭐'; title = 'Молодец!';
    summary = 'Ты прошла все задания. Чем больше играешь — тем легче!';
  }
  var nm = ''; try { nm = localStorage.getItem('omma_name') || ''; } catch (e) {}
  endTitleEl.textContent = nm ? title.replace(/!$/, ', ' + nm + '!') : title;
  starsEl.textContent = stars;
  endSummaryEl.textContent = summary;
  scoreLineEl.textContent = 'Уровень «' + LEVEL_NAMES[currentLevel] + '». С первой попытки: ' + firstTryCount + ' из ' + total;
  playGood();
  if (window.fireConfetti) fireConfetti();
  if (window.awardStars) awardStars('naydi-lishnee', stars.length);
}

/* ---------- Навигация и подтверждение выхода ---------- */
const confirmOverlay = document.getElementById('confirmOverlay');
const confirmTextEl  = document.getElementById('confirmText');
let pendingYes = null;
function askConfirm(msg, onYes) {
  confirmTextEl.textContent = msg;
  pendingYes = onYes;
  confirmOverlay.classList.remove('hidden');
}
document.getElementById('cfYes').addEventListener('click', () => {
  confirmOverlay.classList.add('hidden');
  const fn = pendingYes; pendingYes = null; if (fn) fn();
});
document.getElementById('cfNo').addEventListener('click', () => {
  confirmOverlay.classList.add('hidden'); pendingYes = null;
});

// Игра «на середине»: открыт игровой экран и пройдено хотя бы одно задание.
function midGame() { return !gameScreen.classList.contains('hidden') && pos > 0; }

// Кнопки выбора уровня на стартовом экране.
document.querySelectorAll('.level-btn').forEach((b) => {
  b.addEventListener('click', () => startGame(parseInt(b.getAttribute('data-level'), 10)));
});

// Верхний бар во время игры.
document.getElementById('homeBtn').addEventListener('click', (e) => {
  if (midGame()) {
    e.preventDefault();
    askConfirm('Выйти в меню? Эта игра не сохранится.', () => { window.location.href = 'index.html'; });
  }
});
document.getElementById('levelBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Сменить уровень? Эта игра не сохранится.', showStart);
  else showStart();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Начать заново? Эта игра не сохранится.', () => startGame(currentLevel));
  else startGame(currentLevel);
});

// Финальный экран: переиграть тот же уровень или вернуться к выбору.
document.getElementById('againBtn').addEventListener('click', () => startGame(currentLevel));
document.getElementById('changeLevelBtn').addEventListener('click', showStart);
</script>

  <canvas id="confetti" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;"></canvas>
  <script>
  (function(){
    var cv=document.getElementById('confetti'), cx=cv.getContext('2d'), parts=[], raf=null;
    function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
    window.addEventListener('resize',resize); resize();
    var EMO=['⭐','🌟','💖','💛','✨','🎉','🌸'];
    window.fireConfetti=function(){
      resize();
      for(var i=0;i<40;i++){
        parts.push({x:cv.width*(0.2+Math.random()*0.6), y:cv.height*0.3+(Math.random()-0.5)*60,
          vx:(Math.random()-0.5)*9, vy:-7-Math.random()*7, g:0.28+Math.random()*0.15,
          s:18+Math.random()*16, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3,
          e:EMO[Math.floor(Math.random()*EMO.length)], life:0});
      }
      if(!raf) raf=requestAnimationFrame(step);
    };
    function step(){
      cx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<parts.length;i++){ var p=parts[i];
        p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
        cx.font=p.s+'px "Segoe UI Emoji","Apple Color Emoji",system-ui,sans-serif';
        cx.textAlign='center'; cx.textBaseline='middle';
        cx.globalAlpha=Math.max(0,1-p.life/130);
        cx.fillText(p.e,0,0); cx.restore();
      }
      parts=parts.filter(function(p){return p.life<130 && p.y<cv.height+50;});
      if(parts.length) raf=requestAnimationFrame(step); else { cx.clearRect(0,0,cv.width,cv.height); raf=null; }
    }
  })();
  window.awardStars=function(game,n){try{
    localStorage.setItem('omma_stars_total',(parseInt(localStorage.getItem('omma_stars_total')||'0',10)||0)+n);
    var bk='omma_best_'+game, b=parseInt(localStorage.getItem(bk)||'0',10)||0; if(n>b) localStorage.setItem(bk,n);
    localStorage.setItem('omma_plays_total',(parseInt(localStorage.getItem('omma_plays_total')||'0',10)||0)+1);
  }catch(e){}};
  </script>
