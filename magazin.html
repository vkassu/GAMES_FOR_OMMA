<!DOCTYPE html>
<!--
  Игра «Магазин и сдача» — развивающая цель: ДЕНЬГИ и ВЫЧИТАНИЕ, финграмотность.
  Программа 2–3 класса. Показан товар с ценой и сколько денег дали в кассу;
  ребёнок считает сдачу (заплачено − цена) и выбирает ответ из вариантов.
  Три уровня: 1) платим 10 ₽; 2) платим 50 ₽; 3) платим 100 ₽.
  Обманки специально каверзные (цена, вся купюра, соседние числа), чтобы
  ребёнок действительно считал, а не угадывал.
  Навигация как в других играх: верхний бар (🏠 К играм, 🔄 Заново,
  🎚 Уровень), выбор уровня, подтверждение выхода, переключатель игр, звёзды.
  Чистый HTML/CSS/JS, один файл, офлайн, работает по file:// и на iOS.
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Магазин">
<meta name="mobile-web-app-capable" content="yes">
<title>Магазин и сдача</title>
<style>
  :root {
    --bg1: #d1fae5;
    --bg2: #fef3c7;
    --card: #ffffff;
    --text: #1f2937;
    --accent: #0d9488;
    --good: #22c55e;
    --good-bg: #dcfce7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex; flex-direction: column; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .screen { width: 100%; max-width: 560px; text-align: center; }
  .hidden { display: none; }

  h1 { font-size: clamp(28px, 6.5vw, 44px); margin: 0 0 10px; }
  .lead { color: #4b5563; font-size: clamp(16px, 3.6vw, 21px); margin: 0 0 28px; }

  .btn {
    display: inline-block; border: none; border-radius: 18px;
    padding: 16px 34px; font-size: clamp(18px, 4vw, 24px);
    font-weight: 700; font-family: inherit; color: #fff; background: var(--accent);
    cursor: pointer; box-shadow: 0 8px 20px rgba(13,148,136,0.30);
    touch-action: manipulation; text-decoration: none;
  }
  .btn.secondary { background: #fff; color: var(--accent); box-shadow: 0 6px 16px rgba(13,148,136,0.16); }
  @media (hover: hover) { .btn:hover { filter: brightness(1.05); } }
  .btn:active { transform: scale(0.97); }

  .topbar { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .navbtn { font-family: inherit; font-weight: 700; font-size: clamp(14px, 3.4vw, 17px); border: none; background: #fff; color: var(--accent); border-radius: 999px; padding: 9px 16px; cursor: pointer; text-decoration: none; box-shadow: 0 4px 12px rgba(13,148,136,0.14); touch-action: manipulation; white-space: nowrap; }
  .navbtn:active { transform: scale(0.96); }
  .navright { display: flex; gap: 8px; }
  .navright.hidden { display: none; }

  .levels { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .level-btn { width: 280px; max-width: 100%; }

  .progress { font-size: clamp(15px, 3.4vw, 19px); color: #6b7280; font-weight: 700; margin-bottom: 10px; }

  /* витрина-чек */
  .receipt {
    background: var(--card); border-radius: 24px; padding: 22px 18px;
    box-shadow: 0 12px 30px rgba(13,148,136,0.15); margin-bottom: 18px;
  }
  .product { font-size: clamp(60px, 16vw, 92px); line-height: 1; }
  .price-line { font-size: clamp(20px, 4.6vw, 26px); font-weight: 800; margin-top: 6px; }
  .paid-line { font-size: clamp(18px, 4.2vw, 23px); font-weight: 700; color: #4b5563; margin-top: 6px; }
  .question { font-size: clamp(20px, 4.8vw, 28px); font-weight: 800; color: var(--accent); margin-bottom: 16px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .opt {
    background: var(--card); border: 4px solid transparent; border-radius: 20px;
    padding: 20px 12px; min-height: 76px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(26px, 6.5vw, 38px); color: var(--text); cursor: pointer;
    box-shadow: 0 8px 20px rgba(13,148,136,0.12);
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    touch-action: manipulation; font-variant-numeric: tabular-nums;
  }
  @media (hover: hover) { .opt:hover { transform: translateY(-3px); border-color: var(--accent); } }
  .opt:active { transform: scale(0.97); }
  .opt.correct { background: var(--good-bg); border-color: var(--good); animation: pop 0.4s ease; }
  .opt.wrong { animation: shake 0.45s ease; }
  .opt.locked { pointer-events: none; }
  .opt.dim { opacity: 0.45; }

  @keyframes pop { 0%{transform:scale(1);} 45%{transform:scale(1.10);} 100%{transform:scale(1);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-9px);} 40%{transform:translateX(9px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }

  .feedback { min-height: 40px; margin-top: 18px; font-size: clamp(19px, 4.2vw, 25px); font-weight: 700; }
  .feedback.good { color: var(--good); }
  .feedback.retry { color: #d97706; }
  .next-wrap { min-height: 70px; margin-top: 12px; }

  .final-emoji { font-size: 72px; margin-bottom: 6px; }
  .stars { font-size: clamp(40px, 11vw, 64px); letter-spacing: 6px; margin: 8px 0 4px; animation: pop 0.5s ease; }
  .score-line { font-size: clamp(17px, 3.8vw, 22px); color: #4b5563; font-weight: 700; margin: 8px 0 26px; }
  .final-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  .switcher { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
  .switcher-label { font-size: clamp(15px,3.4vw,18px); font-weight: 700; color: #6b7280; }
  .game-pill { font-size: 30px; text-decoration: none; line-height: 1; background: #fff; border-radius: 16px; padding: 8px 12px; box-shadow: 0 6px 16px rgba(13,148,136,0.14); touch-action: manipulation; }
  .game-pill:active { transform: scale(0.94); }

  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .overlay.hidden { display: none; }
  .confirm-box { background: #fff; border-radius: 24px; padding: 26px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .confirm-box p { font-size: clamp(18px,4.4vw,22px); font-weight: 700; margin: 0 0 20px; }
  .confirm-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cbtn { font-family: inherit; font-weight: 700; font-size: clamp(16px,4vw,20px); border: none; border-radius: 14px; padding: 14px 26px; cursor: pointer; touch-action: manipulation; }
  .cbtn-yes { background: var(--accent); color: #fff; }
  .cbtn-no  { background: #eee; color: #1f2937; }
</style>
</head>
<body>

  <header class="topbar">
    <a class="navbtn" id="homeBtn" href="index.html">🏠 К играм</a>
    <div class="navright hidden" id="navRight">
      <button class="navbtn" id="levelBtn">🎚️ Уровень</button>
      <button class="navbtn" id="restartBtn">🔄 Заново</button>
    </div>
  </header>

  <!-- Экран старта: выбор уровня -->
  <div id="startScreen" class="screen">
    <div class="final-emoji">🛒</div>
    <h1>Магазин и сдача</h1>
    <p class="lead">Посчитай, сколько сдачи получит покупатель.</p>
    <div class="levels">
      <button class="btn level-btn" data-level="1">🙂 Платим 10 ₽</button>
      <button class="btn level-btn" data-level="2">😎 Платим 50 ₽</button>
      <button class="btn level-btn" data-level="3">🤓 Платим 100 ₽</button>
    </div>
  </div>

  <!-- Игровой экран -->
  <div id="gameScreen" class="screen hidden">
    <div class="progress" id="progress">Покупка 1 из 10</div>
    <div class="receipt">
      <div class="product" id="product">🍎</div>
      <div class="price-line" id="price">Цена: 7 ₽</div>
      <div class="paid-line" id="paid">Заплатили: 💵 10 ₽</div>
    </div>
    <div class="question">Сколько сдачи? 💰</div>
    <div class="grid" id="grid"></div>
    <div class="feedback" id="feedback"></div>
    <div class="next-wrap" id="nextWrap"></div>
  </div>

  <!-- Финальный экран -->
  <div id="endScreen" class="screen hidden">
    <div class="final-emoji">🌟</div>
    <h1 id="endTitle">Молодец!</h1>
    <div class="stars" id="stars"></div>
    <p class="lead" id="endSummary">Ты посчитал всю сдачу!</p>
    <p class="score-line" id="scoreLine"></p>
    <div class="final-buttons">
      <button class="btn" id="againBtn">Играть ещё раз 🔁</button>
      <button class="btn secondary" id="changeLevelBtn">Сменить уровень 🎚️</button>
    </div>
    <div class="switcher">
      <span class="switcher-label">Другая игра:</span>
      <a class="game-pill" href="matematika.html" title="Математика">🧮</a>
      <a class="game-pill" href="pamyat.html" title="Память">🧠</a>
      <a class="game-pill" href="naydi-lishnee.html" title="Найди лишнее">🔍</a>
      <a class="game-pill" href="zagadki.html" title="Загадки">🤔</a>
      <a class="game-pill" href="chasy.html" title="Который час?">🕐</a>
      <a class="game-pill" href="labirint.html" title="Лабиринт">🌀</a>
    </div>
  </div>

  <div class="overlay hidden" id="confirmOverlay">
    <div class="confirm-box">
      <p id="confirmText">Выйти? Прогресс не сохранится.</p>
      <div class="confirm-actions">
        <button class="cbtn cbtn-yes" id="cfYes">Да</button>
        <button class="cbtn cbtn-no" id="cfNo">Остаться</button>
      </div>
    </div>
  </div>

<script>
"use strict";

/* ---------- Параметры ----------
   На каждом уровне покупатель платит фиксированной купюрой,
   а цена меньше неё, чтобы сдача была положительной.
*/
const PAY = { 1: 10, 2: 50, 3: 100 };
const LEVEL_NAMES = { 1: 'Платим 10 ₽', 2: 'Платим 50 ₽', 3: 'Платим 100 ₽' };
const GAME_SIZE = 10;

// Товары — только «старые» эмодзи (есть в любом шрифте).
const PRODUCTS = ['🍎','🍌','🍐','🍊','🍓','🍇','🍉','🍒','🍞','🥚','🧀','🍪','🍫',
                  '🍬','🍭','🍩','🍦','🥤','⚽','🎨','✏️','📕','📒','🧸','🎈','🚗',
                  '🎁','🍕','🥕','🌷'];

const startScreen = document.getElementById('startScreen');
const gameScreen  = document.getElementById('gameScreen');
const endScreen   = document.getElementById('endScreen');
const gridEl      = document.getElementById('grid');
const progressEl  = document.getElementById('progress');
const productEl   = document.getElementById('product');
const priceEl     = document.getElementById('price');
const paidEl      = document.getElementById('paid');
const feedbackEl  = document.getElementById('feedback');
const nextWrapEl  = document.getElementById('nextWrap');
const scoreLineEl = document.getElementById('scoreLine');
const starsEl     = document.getElementById('stars');
const endTitleEl  = document.getElementById('endTitle');
const endSummaryEl= document.getElementById('endSummary');
const navRight    = document.getElementById('navRight');

let pos = 0;
let firstTryCount = 0;
let triedThis = false;
let currentLevel = 1;
let answerChange = 0;     // правильная сдача текущей покупки

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function makeQuestion(level) {
  const pay = PAY[level];
  const price = randInt(1, pay - 1);
  const change = pay - price;
  const emoji = PRODUCTS[randInt(0, PRODUCTS.length - 1)];

  // Обманки: цена (частая ошибка), вся купюра, соседние и «на десяток» числа.
  const seen = new Set([change]);
  const pool = [];
  const step = level >= 3 ? 10 : (level === 2 ? 5 : 1);
  function add(v) { if (v >= 1 && v <= pay && !seen.has(v)) { seen.add(v); pool.push(v); } }
  add(price);
  add(change + 1); add(change - 1);
  add(change + step); add(change - step);
  add(pay);
  let g = 0;
  while (pool.length < 3 && g++ < 80) add(randInt(1, pay));

  const opts = shuffle([change].concat(shuffle(pool).slice(0, 3)));
  return { emoji, price, pay, change, opts };
}

/* ---------- Логика игры ---------- */
function showStart() {
  gameScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
  navRight.classList.add('hidden');
}

function startGame(level) {
  currentLevel = level;
  pos = 0;
  firstTryCount = 0;
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  navRight.classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  triedThis = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  nextWrapEl.innerHTML = '';

  progressEl.textContent = LEVEL_NAMES[currentLevel] + ' · Покупка ' + (pos + 1) + ' из ' + GAME_SIZE;

  const q = makeQuestion(currentLevel);
  answerChange = q.change;
  productEl.textContent = q.emoji;
  priceEl.textContent = 'Цена: ' + q.price + ' ₽';
  paidEl.textContent = 'Заплатили: 💵 ' + q.pay + ' ₽';

  gridEl.innerHTML = '';
  q.opts.forEach((v) => {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'opt';
    cell.textContent = v + ' ₽';
    cell.addEventListener('click', () => onPick(cell, v === answerChange));
    gridEl.appendChild(cell);
  });
}

function onPick(cell, isCorrect) {
  ensureAudio();
  if (isCorrect) {
    cell.classList.add('correct', 'locked');
    [...gridEl.children].forEach((c) => { c.classList.add('locked'); if (c !== cell) c.classList.add('dim'); });
    if (!triedThis) firstTryCount++;
    playGood();
    feedbackEl.textContent = 'Верно! Сдача ' + answerChange + ' ₽ 🎉';
    feedbackEl.className = 'feedback good';

    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn';
    nextBtn.textContent = (pos + 1 < GAME_SIZE) ? 'Дальше ▶' : 'Закончить ✓';
    nextBtn.addEventListener('click', goNext);
    nextWrapEl.innerHTML = '';
    nextWrapEl.appendChild(nextBtn);
  } else {
    triedThis = true;
    playRetry();
    cell.classList.remove('wrong');
    void cell.offsetWidth;
    cell.classList.add('wrong');
    feedbackEl.textContent = 'Посчитай ещё раз 🙂';
    feedbackEl.className = 'feedback retry';
  }
}

function goNext() {
  pos++;
  if (pos < GAME_SIZE) renderQuestion();
  else showEnd();
}

function showEnd() {
  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  navRight.classList.add('hidden');

  const total = GAME_SIZE;
  let stars, title, summary;
  if (firstTryCount >= total - 1) {
    stars = '⭐⭐⭐'; title = 'Превосходно!';
    summary = 'Почти всё с первой попытки — настоящий кассир!';
  } else if (firstTryCount >= Math.ceil(total * 0.6)) {
    stars = '⭐⭐'; title = 'Здорово!';
    summary = 'Очень хороший результат. Ещё разок — и будет три звёздочки!';
  } else {
    stars = '⭐'; title = 'Молодец!';
    summary = 'Ты посчитал всю сдачу. Чем больше тренируешься — тем легче!';
  }
  endTitleEl.textContent = title;
  starsEl.textContent = stars;
  endSummaryEl.textContent = summary;
  scoreLineEl.textContent = 'Уровень «' + LEVEL_NAMES[currentLevel] + '». С первой попытки: ' + firstTryCount + ' из ' + total;
  playGood();
  if (window.fireConfetti) fireConfetti();
}

/* ---------- Звук: один переиспользуемый AudioContext (правило iOS) ---------- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freqs, dur, type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  freqs.forEach((f, i) => {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    const t0 = now + i * 0.12;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  });
}
const playGood  = () => tone([523.25, 659.25, 783.99], 0.22);
const playRetry = () => tone([330, 247], 0.16, 'triangle');

/* ---------- Навигация и подтверждение выхода ---------- */
const confirmOverlay = document.getElementById('confirmOverlay');
const confirmTextEl  = document.getElementById('confirmText');
let pendingYes = null;
function askConfirm(msg, onYes) { confirmTextEl.textContent = msg; pendingYes = onYes; confirmOverlay.classList.remove('hidden'); }
document.getElementById('cfYes').addEventListener('click', () => { confirmOverlay.classList.add('hidden'); const fn = pendingYes; pendingYes = null; if (fn) fn(); });
document.getElementById('cfNo').addEventListener('click', () => { confirmOverlay.classList.add('hidden'); pendingYes = null; });

function midGame() { return !gameScreen.classList.contains('hidden') && pos > 0; }

document.querySelectorAll('.level-btn').forEach((b) => {
  b.addEventListener('click', () => { ensureAudio(); startGame(parseInt(b.getAttribute('data-level'), 10)); });
});
document.getElementById('homeBtn').addEventListener('click', (e) => {
  if (midGame()) { e.preventDefault(); askConfirm('Выйти в меню? Эта игра не сохранится.', () => { window.location.href = 'index.html'; }); }
});
document.getElementById('levelBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Сменить уровень? Эта игра не сохранится.', showStart); else showStart();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Начать заново? Эта игра не сохранится.', () => startGame(currentLevel)); else startGame(currentLevel);
});
document.getElementById('againBtn').addEventListener('click', () => startGame(currentLevel));
document.getElementById('changeLevelBtn').addEventListener('click', showStart);
</script>

  <canvas id="confetti" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;"></canvas>
  <script>
  (function(){
    var cv=document.getElementById('confetti'), cx=cv.getContext('2d'), parts=[], raf=null;
    function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
    window.addEventListener('resize',resize); resize();
    var EMO=['⭐','🌟','💖','💛','✨','🎉','🌸'];
    window.fireConfetti=function(){
      resize();
      for(var i=0;i<40;i++){
        parts.push({x:cv.width*(0.2+Math.random()*0.6), y:cv.height*0.3+(Math.random()-0.5)*60,
          vx:(Math.random()-0.5)*9, vy:-7-Math.random()*7, g:0.28+Math.random()*0.15,
          s:18+Math.random()*16, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3,
          e:EMO[Math.floor(Math.random()*EMO.length)], life:0});
      }
      if(!raf) raf=requestAnimationFrame(step);
    };
    function step(){
      cx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<parts.length;i++){ var p=parts[i];
        p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
        cx.font=p.s+'px "Segoe UI Emoji","Apple Color Emoji",system-ui,sans-serif';
        cx.textAlign='center'; cx.textBaseline='middle';
        cx.globalAlpha=Math.max(0,1-p.life/130);
        cx.fillText(p.e,0,0); cx.restore();
      }
      parts=parts.filter(function(p){return p.life<130 && p.y<cv.height+50;});
      if(parts.length) raf=requestAnimationFrame(step); else { cx.clearRect(0,0,cv.width,cv.height); raf=null; }
    }
  })();
  </script>
</body>
