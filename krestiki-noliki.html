<!DOCTYPE html>
<!--
  Игра «Крестики-нолики» — развивающая цель: ЛОГИКА, ПЛАНИРОВАНИЕ, стратегия.
  Классические ❌⭕ 3×3. Три режима:
    • «С другом» — двое игроков по очереди на одном экране.
    • «Против кошки» — лёгкий бот, ходит случайно.
    • «Против лисы» — хитрый бот: старается выиграть и блокировать,
      но с ~20% шансом делает случайный ход, чтобы ребёнок мог победить.
  Игрок (или Игрок 1) всегда ходит первым за ❌.
  Плюшки как в других играх: верхний бар, конфетти на победе, копилка
  звёзд, имя игрока в похвале, общие темы, iOS-совместимость.
  Чистый HTML/CSS/JS, один файл, офлайн, работает по file://.
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Крестики-нолики">
<meta name="mobile-web-app-capable" content="yes">
<title>Крестики-нолики</title>
<style>
  :root {
    --bg1: #ede9fe;
    --bg2: #e0f2fe;
    --card: #ffffff;
    --text: #1f2937;
    --accent: #6366f1;
    --win: #fde68a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex; flex-direction: column; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .screen { width: 100%; max-width: 460px; text-align: center; }
  .hidden { display: none; }

  h1 { font-size: clamp(24px, 5.6vw, 38px); margin: 0 0 10px; }
  .lead { color: #4b5563; font-size: clamp(15px, 3.6vw, 20px); margin: 0 0 22px; }

  .btn {
    display: inline-block; border: none; border-radius: 18px;
    padding: 16px 30px; font-size: clamp(17px, 4vw, 23px);
    font-weight: 700; font-family: inherit; color: #fff; background: var(--accent);
    cursor: pointer; box-shadow: 0 8px 20px rgba(99,102,241,0.30);
    touch-action: manipulation; text-decoration: none;
  }
  .btn.secondary { background: #fff; color: var(--accent); box-shadow: 0 6px 16px rgba(99,102,241,0.16); }
  @media (hover: hover) { .btn:hover { filter: brightness(1.05); } }
  .btn:active { transform: scale(0.97); }

  .topbar { width: 100%; max-width: 460px; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .navbtn { font-family: inherit; font-weight: 700; font-size: clamp(13px, 3.2vw, 16px); border: none; background: #fff; color: var(--accent); border-radius: 999px; padding: 9px 14px; cursor: pointer; text-decoration: none; box-shadow: 0 4px 12px rgba(99,102,241,0.14); touch-action: manipulation; white-space: nowrap; }
  .navbtn:active { transform: scale(0.96); }
  .navright { display: flex; gap: 8px; }
  .navright.hidden { display: none; }

  .levels { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .lvl-btn { width: 300px; max-width: 100%; }

  .score-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .score-strip .sc { background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: clamp(13px, 3.2vw, 16px); color: #4b5563; box-shadow: 0 3px 10px rgba(99,102,241,0.10); }

  .turn { font-size: clamp(18px, 4.4vw, 24px); font-weight: 800; margin-bottom: 14px; min-height: 32px; }

  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    width: min(340px, 90vw); aspect-ratio: 1; margin: 0 auto;
  }
  .cell {
    background: #fff; border: none; border-radius: 20px;
    font-size: clamp(48px, 14vw, 72px); line-height: 1;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation; padding: 0;
    box-shadow: 0 6px 16px rgba(99,102,241,0.14);
    transition: transform 0.1s ease, background 0.25s ease;
  }
  .cell:disabled { cursor: default; }
  .cell.win { background: var(--win); animation: winpulse 0.55s ease; }
  .cell:not(:disabled):active { transform: scale(0.94); }
  @keyframes winpulse {
    0% { transform: scale(1); } 45% { transform: scale(1.1); } 100% { transform: scale(1); }
  }

  .hint { font-size: clamp(13px, 3.2vw, 16px); color: #6b7280; margin-top: 16px; }

  .final-emoji { font-size: 66px; margin-bottom: 6px; letter-spacing: 6px; }
  .stars { font-size: clamp(40px, 11vw, 64px); letter-spacing: 6px; margin: 8px 0 4px; animation: pop 0.5s ease; min-height: 40px; }
  @keyframes pop { 0%{transform:scale(1);} 45%{transform:scale(1.10);} 100%{transform:scale(1);} }
  .score-line { font-size: clamp(17px, 3.8vw, 22px); color: #4b5563; font-weight: 700; margin: 8px 0 26px; }
  .final-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  .switcher { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
  .switcher-label { font-size: clamp(15px,3.4vw,18px); font-weight: 700; color: #6b7280; }
  .game-pill { font-size: 30px; text-decoration: none; line-height: 1; background: #fff; border-radius: 16px; padding: 8px 12px; box-shadow: 0 6px 16px rgba(99,102,241,0.14); touch-action: manipulation; }
  .game-pill:active { transform: scale(0.94); }

  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .overlay.hidden { display: none; }
  .confirm-box, .round-box { background: #fff; border-radius: 24px; padding: 26px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .round-emoji { font-size: 60px; margin-bottom: 6px; line-height: 1; }
  .round-title { font-size: clamp(20px,4.8vw,26px); font-weight: 800; margin: 0 0 6px; }
  .round-sub { font-size: clamp(15px,3.6vw,18px); color: #4b5563; margin: 0 0 20px; }
  .round-actions, .confirm-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cbtn { font-family: inherit; font-weight: 700; font-size: clamp(16px,4vw,20px); border: none; border-radius: 14px; padding: 14px 26px; cursor: pointer; touch-action: manipulation; }
  .cbtn-yes { background: var(--accent); color: #fff; }
  .cbtn-no  { background: #eee; color: #1f2937; }
  .confirm-box p { font-size: clamp(18px,4.4vw,22px); font-weight: 700; margin: 0 0 20px; }
</style>
</head>
<body>

  <header class="topbar">
    <a class="navbtn" id="homeBtn" href="index.html">🏠 К играм</a>
    <div class="navright hidden" id="navRight">
      <button class="navbtn" id="modeBtn">🎚️ Режим</button>
      <button class="navbtn" id="restartBtn">🔄 Заново</button>
    </div>
  </header>

  <!-- Старт: выбор режима -->
  <div id="startScreen" class="screen">
    <div class="final-emoji">❌ ⭕</div>
    <h1>Крестики-нолики</h1>
    <p class="lead">Собери три в ряд раньше противника</p>
    <div class="levels">
      <button class="btn lvl-btn" data-mode="friend">👫 С другом</button>
      <button class="btn lvl-btn" data-mode="cat">🐱 Против кошки</button>
      <button class="btn lvl-btn" data-mode="fox">🦊 Против лисы</button>
    </div>
    <div class="hint">Первым ходит ❌</div>
  </div>

  <!-- Игровой экран -->
  <div id="gameScreen" class="screen hidden">
    <div class="score-strip" id="scoreStrip"></div>
    <div class="turn" id="turnLabel">Твой ход ❌</div>
    <div class="board" id="board">
      <button class="cell" data-i="0"></button>
      <button class="cell" data-i="1"></button>
      <button class="cell" data-i="2"></button>
      <button class="cell" data-i="3"></button>
      <button class="cell" data-i="4"></button>
      <button class="cell" data-i="5"></button>
      <button class="cell" data-i="6"></button>
      <button class="cell" data-i="7"></button>
      <button class="cell" data-i="8"></button>

  <!-- Итог раунда: маленькое окошко после каждой партии -->
  <div class="overlay hidden" id="roundOverlay">
    <div class="round-box">
      <div class="round-emoji" id="roundEmoji"></div>

      <p class="round-sub" id="roundSub"></p>
      <div class="round-actions">
        <button class="cbtn cbtn-yes" id="againBtn">Ещё раз 🔁</button>
        <button class="cbtn cbtn-no" id="stopBtn">Хватит 🏁</button>
      </div>
    </div>
  </div>

  <!-- Финал: итог сессии -->
  <div id="endScreen" class="screen hidden">
    <div class="final-emoji">🏆</div>
    <h1 id="endTitle">Молодец!</h1>
    <div class="stars" id="stars"></div>
    <p class="lead" id="endSummary"></p>
    <p class="score-line" id="scoreLine"></p>
    <div class="final-buttons">
      <button class="btn" id="playAgainBtn">Ещё раз 🔁</button>
      <button class="btn secondary" id="changeModeBtn">Другой режим</button>
    </div>
    <div class="switcher">
      <span class="switcher-label">Другая игра:</span>
      <a class="game-pill" href="matematika.html" title="Математика">🧮</a>
      <a class="game-pill" href="pamyat.html" title="Память">🧠</a>
      <a class="game-pill" href="naydi-lishnee.html" title="Найди лишнее">🔍</a>
      <a class="game-pill" href="zagadki.html" title="Загадки">🤔</a>
      <a class="game-pill" href="chasy.html" title="Который час?">🕐</a>
      <a class="game-pill" href="magazin.html" title="Магазин и сдача">🛒</a>
      <a class="game-pill" href="labirint.html" title="Помоги зайке найти морковку">🌀</a>
      <a class="game-pill" href="tatar.html" title="Татарские слова">🗣️</a>
      <a class="game-pill" href="english.html" title="Английские слова">🔤</a>
      <a class="game-pill" href="kirpichi.html" title="Увернись от кирпичей">🧱</a>

  <!-- Подтверждение выхода -->
  <div class="overlay hidden" id="confirmOverlay">
    <div class="confirm-box">
      <p id="confirmText">Выйти? Результат не сохранится.</p>
      <div class="confirm-actions">
        <button class="cbtn cbtn-yes" id="cfYes">Да</button>
        <button class="cbtn cbtn-no" id="cfNo">Остаться</button>
      </div>
    </div>

<script>
"use strict";

const startScreen = document.getElementById('startScreen');
const gameScreen  = document.getElementById('gameScreen');
const endScreen   = document.getElementById('endScreen');
const scoreStripEl = document.getElementById('scoreStrip');
const turnLabelEl = document.getElementById('turnLabel');
const boardEl = document.getElementById('board');
const cellEls = Array.from(document.querySelectorAll('.cell'));
const navRight = document.getElementById('navRight');
const scoreLineEl = document.getElementById('scoreLine');
const starsEl = document.getElementById('stars');
const endTitleEl = document.getElementById('endTitle');
const endSummaryEl = document.getElementById('endSummary');
const roundOverlay = document.getElementById('roundOverlay');
const roundEmojiEl = document.getElementById('roundEmoji');
const roundTitleEl = document.getElementById('roundTitle');
const roundSubEl = document.getElementById('roundSub');

const MODES = {
  friend: { name: 'С другом',     emoji: '👫', foeName: 'друг',   isBot: false },
  cat:    { name: 'Против кошки', emoji: '🐱', foeName: 'кошка',  isBot: true,  hard: false },
  fox:    { name: 'Против лисы',  emoji: '🦊', foeName: 'лиса',   isBot: true,  hard: true  }
};

// Индексы клеток на доске:
//  0 | 1 | 2
//  3 | 4 | 5
//  6 | 7 | 8
const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],  // строки
  [0,3,6],[1,4,7],[2,5,8],  // столбцы
  [0,4,8],[2,4,6]           // диагонали
];

let state = 'start';                        // 'start' | 'play' | 'roundOver' | 'end'
let mode = 'friend', M = MODES.friend;
let board = new Array(9).fill(0);           // 0 пусто, 1 = ❌, 2 = ⭕
let currentPlayer = 1;                      // всегда стартует ❌
let session = { wins: 0, losses: 0, draws: 0, games: 0, p1: 0, p2: 0 };
let roundTimer = null;

function symbolFor(p) { return p === 1 ? '❌' : '⭕'; }
function getName() { try { return localStorage.getItem('omma_name') || ''; } catch (e) { return ''; } }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function updateScoreStrip() {
  let html = '';
  if (M.isBot) {
    html += '<span class="sc">Ты ❌: ' + session.wins + '</span>';
    html += '<span class="sc">' + M.emoji + ' ' + M.foeName + ': ' + session.losses + '</span>';
    html += '<span class="sc">🤝 ' + session.draws + '</span>';
  } else {
    html += '<span class="sc">❌ Игрок 1: ' + session.p1 + '</span>';
    html += '<span class="sc">⭕ Игрок 2: ' + session.p2 + '</span>';
    html += '<span class="sc">🤝 ' + session.draws + '</span>';
  }
  scoreStripEl.innerHTML = html;
}

function updateTurnLabel() {
  if (state !== 'play') { turnLabelEl.textContent = ''; return; }
  if (M.isBot) {
    turnLabelEl.textContent = (currentPlayer === 1)
      ? 'Твой ход ❌'
      : 'Ход ' + M.foeName + ' ' + M.emoji + '…';
  } else {
    turnLabelEl.textContent = 'Ход: Игрок ' + currentPlayer + ' ' + symbolFor(currentPlayer);
  }
}

function paintBoard(highlight) {
  for (let i = 0; i < 9; i++) {
    const el = cellEls[i];
    el.classList.remove('win');
    if (board[i] === 1) { el.textContent = '❌'; el.disabled = true; }
    else if (board[i] === 2) { el.textContent = '⭕'; el.disabled = true; }
    else {
      el.textContent = '';
      const botTurn = (M.isBot && currentPlayer === 2);
      el.disabled = (state !== 'play') || botTurn;
    }
    if (highlight && highlight.indexOf(i) >= 0) el.classList.add('win');
  }
}

function checkWinner(b) {
  for (let k = 0; k < WIN_LINES.length; k++) {
    const [a, c, d] = WIN_LINES[k];
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { player: b[a], line: WIN_LINES[k] };
  }
  for (let i = 0; i < 9; i++) if (b[i] === 0) return null;
  return { player: 0, line: null }; // ничья
}

function startNewRound() {
  if (roundTimer) { clearTimeout(roundTimer); roundTimer = null; }
  board = new Array(9).fill(0);
  currentPlayer = 1;
  state = 'play';
  roundOverlay.classList.add('hidden');
  paintBoard(null);
  updateTurnLabel();
}

function startSession(m) {
  ensureAudio();
  mode = m; M = MODES[m];
  session = { wins: 0, losses: 0, draws: 0, games: 0, p1: 0, p2: 0 };
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  navRight.classList.remove('hidden');
  updateScoreStrip();
  startNewRound();
}

function onCellClick(i) {
  if (state !== 'play') return;
  if (board[i] !== 0) return;
  if (M.isBot && currentPlayer === 2) return;
  makeMove(i, currentPlayer);
}

function makeMove(i, player) {
  board[i] = player;
  playTick();
  const res = checkWinner(board);
  if (res) {
    paintBoard(res.line);
    endRound(res);
    return;
  }
  currentPlayer = 3 - currentPlayer;
  paintBoard(null);
  updateTurnLabel();
  if (M.isBot && currentPlayer === 2) {
    // задержка «раздумья» бота, чтобы не выглядел мгновенным
    const delay = 500 + Math.random() * 450;
    setTimeout(() => {
      if (state !== 'play' || currentPlayer !== 2) return;
      const idx = pickBotMove();
      if (idx == null || idx < 0) return;
      makeMove(idx, 2);
    }, delay);
  }
}

function emptyCells() {
  const r = [];
  for (let i = 0; i < 9; i++) if (board[i] === 0) r.push(i);
  return r;
}

function pickBotMove() {
  return M.hard ? foxMove() : catMove();
}

function catMove() {
  const empty = emptyCells();
  return empty[Math.floor(Math.random() * empty.length)];
}

function foxMove() {
  // 20% шанс на случайный ход — чтобы у ребёнка был реальный шанс выиграть.
  if (Math.random() < 0.20) return catMove();
  // 1. Если можно выиграть за один ход — выиграть.
  let idx = findLineMove(2);
  if (idx >= 0) return idx;
  // 2. Если игрок может выиграть — заблокировать.
  idx = findLineMove(1);
  if (idx >= 0) return idx;
  // 3. Центр.
  if (board[4] === 0) return 4;
  // 4. Свободный угол.
  const corners = [0, 2, 6, 8].filter(i => board[i] === 0);
  if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
  // 5. Свободный край.
  const edges = [1, 3, 5, 7].filter(i => board[i] === 0);
  if (edges.length) return edges[Math.floor(Math.random() * edges.length)];
  return catMove();
}

function findLineMove(p) {
  // Возвращает индекс пустой клетки, поставив p в которую, p выиграет.
  for (let k = 0; k < WIN_LINES.length; k++) {
    const [a, b, c] = WIN_LINES[k];
    const trio = [board[a], board[b], board[c]];
    let cnt = 0, zero = -1;
    for (let j = 0; j < 3; j++) {
      if (trio[j] === p) cnt++;
      else if (trio[j] === 0) zero = j;
    }
    if (cnt === 2 && zero >= 0) return WIN_LINES[k][zero];
  }
  return -1;
}

function endRound(res) {
  state = 'roundOver';
  session.games++;
  for (let i = 0; i < 9; i++) cellEls[i].disabled = true;
  turnLabelEl.textContent = '';

  const nm = getName();
  let title, sub, emo;

  if (res.player === 0) {
    session.draws++;
    title = 'Ничья';
    sub = 'Никто не выиграл. Сыграем ещё?';
    emo = '🤝';
    playDraw();
  } else if (M.isBot) {
    if (res.player === 1) {
      session.wins++;
      title = nm ? ('Ты выиграл, ' + nm + '!') : 'Ты выиграл!';
      sub = 'Ты обыграл ' + M.foeName + '! 🎉';
      emo = '🎉';
      playGood();
      if (window.fireConfetti) fireConfetti();
    } else {
      session.losses++;
      title = cap(M.foeName) + ' выиграла';
      sub = 'Ничего страшного — в следующий раз получится ✨';
      emo = M.emoji;
      playRetry();
    }
  } else {
    // 2 игрока
    if (res.player === 1) { session.p1++; title = 'Победил Игрок 1 ❌'; }
    else                  { session.p2++; title = 'Победил Игрок 2 ⭕'; }
    sub = 'Молодец! Сыграем ещё?';
    emo = '🎉';
    playGood();
    if (window.fireConfetti) fireConfetti();
  }

  updateScoreStrip();
  roundEmojiEl.textContent = emo;
  roundTitleEl.textContent = title;
  roundSubEl.textContent = sub;
  // Даём чуть посмотреть на подсветку победной линии до появления окна.
  const delay = res.player === 0 ? 450 : 800;
  roundTimer = setTimeout(() => { roundOverlay.classList.remove('hidden'); roundTimer = null; }, delay);
}

function endSession() {
  if (roundTimer) { clearTimeout(roundTimer); roundTimer = null; }
  state = 'end';
  gameScreen.classList.add('hidden');
  roundOverlay.classList.add('hidden');
  navRight.classList.add('hidden');
  endScreen.classList.remove('hidden');

  let stars = 0, title, summary;
  const nm = getName();

  if (M.isBot) {
    if (session.wins >= 3) {
      stars = 3; title = 'Ты чемпион!';
      summary = 'Ты обыграл ' + M.foeName + ' целых ' + session.wins + ' раз!';
    } else if (session.wins === 2) {
      stars = 2; title = 'Здорово!';
      summary = 'Две победы над ' + M.foeName + '!';
    } else if (session.wins === 1) {
      stars = 1; title = 'Молодец!';
      summary = 'Одна победа над ' + M.foeName + ' — это круто!';
    } else if (session.games >= 1) {
      stars = 1; title = 'Хорошо играл!';
      summary = cap(M.foeName) + ' сегодня хитрая. В следующий раз обязательно обыграешь ✨';
    } else {
      stars = 0; title = 'Возвращайся!';
      summary = 'Сыграй хотя бы одну игру.';
    }
  } else {
    if (session.games >= 3)      { stars = 2; title = 'Хорошо поиграли!'; }
    else if (session.games >= 1) { stars = 1; title = 'Хорошо поиграли!'; }
    else                         { stars = 0; title = 'Возвращайтесь!';   }
    summary = (session.games >= 1)
      ? ('Игрок 1 ❌: ' + session.p1 + ' · Игрок 2 ⭕: ' + session.p2 + ' · ничьи: ' + session.draws)
      : 'Сыграйте хотя бы одну игру.';
  }

  endTitleEl.textContent = nm && M.isBot ? title.replace(/!$/, ', ' + nm + '!') : title;
  starsEl.textContent = stars ? '⭐'.repeat(stars) : '';
  endSummaryEl.textContent = summary;
  scoreLineEl.textContent = 'Режим «' + M.name + '». Игр: ' + session.games + '.';

  if (stars > 0 && window.awardStars) awardStars('krestiki', stars);
  if (stars >= 2 && window.fireConfetti) fireConfetti();
}

function showStart() {
  if (roundTimer) { clearTimeout(roundTimer); roundTimer = null; }
  state = 'start';
  roundOverlay.classList.add('hidden');
  gameScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  navRight.classList.add('hidden');
  startScreen.classList.remove('hidden');
}

/* ---------- Обработчики ---------- */
cellEls.forEach((el) => {
  el.addEventListener('click', () => onCellClick(parseInt(el.getAttribute('data-i'), 10)));
});

document.querySelectorAll('.lvl-btn').forEach((b) => {
  b.addEventListener('click', () => { ensureAudio(); startSession(b.getAttribute('data-mode')); });
});

document.getElementById('againBtn').addEventListener('click', () => {
  roundOverlay.classList.add('hidden'); startNewRound();
});
document.getElementById('stopBtn').addEventListener('click', () => {
  roundOverlay.classList.add('hidden'); endSession();
});
document.getElementById('playAgainBtn').addEventListener('click', () => startSession(mode));
document.getElementById('changeModeBtn').addEventListener('click', showStart);

function midGame() { return state === 'play' || state === 'roundOver'; }

const confirmOverlay = document.getElementById('confirmOverlay');
const confirmTextEl = document.getElementById('confirmText');
let pendingYes = null;
function askConfirm(msg, onYes) {
  confirmTextEl.textContent = msg; pendingYes = onYes;
  confirmOverlay.classList.remove('hidden');
}
document.getElementById('cfYes').addEventListener('click', () => {
  confirmOverlay.classList.add('hidden'); const fn = pendingYes; pendingYes = null; if (fn) fn();
});
document.getElementById('cfNo').addEventListener('click', () => {
  confirmOverlay.classList.add('hidden'); pendingYes = null;
});

document.getElementById('homeBtn').addEventListener('click', (e) => {
  if (midGame()) {
    e.preventDefault();
    askConfirm('Выйти в меню? Результат не сохранится.', () => { window.location.href = 'index.html'; });
  }
});
document.getElementById('modeBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Выбрать другой режим? Результат не сохранится.', showStart);
  else showStart();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  if (midGame()) askConfirm('Начать заново? Счёт обнулится.', () => startSession(mode));
  else startSession(mode);
});

/* ---------- Звук ---------- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freqs, dur, type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  freqs.forEach(function (f, i) {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    const t0 = now + i * 0.12;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  });
}
const playGood  = () => tone([523.25, 659.25, 783.99], 0.22);
const playRetry = () => tone([300, 200], 0.18, 'triangle');
const playDraw  = () => tone([440], 0.16, 'triangle');
const playTick  = () => tone([660], 0.05, 'sine');
</script>

  <canvas id="confetti" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;"></canvas>
  <script>
  (function(){
    var cv=document.getElementById('confetti'), cx=cv.getContext('2d'), parts=[], raf=null;
    function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
    window.addEventListener('resize',resize); resize();
    var EMO=['⭐','🌟','💖','💛','✨','🎉','🌸'];
    window.fireConfetti=function(){
      resize();
      for(var i=0;i<40;i++){
        parts.push({x:cv.width*(0.2+Math.random()*0.6), y:cv.height*0.3+(Math.random()-0.5)*60,
          vx:(Math.random()-0.5)*9, vy:-7-Math.random()*7, g:0.28+Math.random()*0.15,
          s:18+Math.random()*16, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3,
          e:EMO[Math.floor(Math.random()*EMO.length)], life:0});
      }
      if(!raf) raf=requestAnimationFrame(step);
    };
    function step(){
      cx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<parts.length;i++){ var p=parts[i];
        p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
        cx.font=p.s+'px "Segoe UI Emoji","Apple Color Emoji",system-ui,sans-serif';
        cx.textAlign='center'; cx.textBaseline='middle';
        cx.globalAlpha=Math.max(0,1-p.life/130);
        cx.fillText(p.e,0,0); cx.restore();
      }
      parts=parts.filter(function(p){return p.life<130 && p.y<cv.height+50;});
      if(parts.length) raf=requestAnimationFrame(step); else { cx.clearRect(0,0,cv.width,cv.height); raf=null; }
    }
  })();
  window.awardStars=function(game,n){try{
    localStorage.setItem('omma_stars_total',(parseInt(localStorage.getItem('omma_stars_total')||'0',10)||0)+n);
    var bk='omma_best_'+game, b=parseInt(localStorage.getItem(bk)||'0',10)||0; if(n>b) localStorage.setItem(bk,n);
    localStorage.setItem('omma_plays_total',(parseInt(localStorage.getItem('omma_plays_total')||'0',10)||0)+1);
  }catch(e){}};
  </script>
